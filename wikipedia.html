<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WIKIPEDIA // DAILY PULSE</title>
<style>
  :root{
    --bg-deep:#eaecf0;
    --bg-mid:#ffffff;
    --panel:#eaecf0;
    --blue:#3366cc;
    --blue-dim:#a3bdf0;
    --green:#14866d;
    --amber:#ac6600;
    --red:#d73333;
    --text-hi:#202122;
    --text-mid:#404244;
    --text-lo:#72777d;
    --rule:rgba(51,102,204,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 50% at 50% 24%, var(--bg-mid) 0%, var(--bg-deep) 75%);
    color:var(--text-hi);
    font-family:"JetBrains Mono","Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    display:flex;flex-direction:column;
    -webkit-user-select:none;user-select:none;
    cursor:none;
  }
  .serif{font-family:"Linux Libertine","Georgia","Times New Roman",serif}
  .pad{padding-left:clamp(16px,4vw,40px);padding-right:clamp(16px,4vw,40px)}
  header{padding-top:clamp(14px,2.4vh,30px);display:flex;flex-direction:column;gap:6px}
  .topline{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  h1{font-size:clamp(15px,2.1vh,26px);font-weight:700;letter-spacing:.38em;text-transform:uppercase;white-space:nowrap}
  h1 .slash{color:var(--blue);font-weight:400}
  .clock{font-size:clamp(11px,1.5vh,16px);color:var(--text-mid);letter-spacing:.12em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .statusline{display:flex;align-items:center;gap:10px;font-size:clamp(10px,1.35vh,14px);letter-spacing:.14em;color:var(--text-mid);flex-wrap:wrap}
  .beacon{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .mode{padding:1px 7px;border:1px solid var(--rule);border-radius:2px;font-size:.85em;color:var(--text-lo)}
  .mode.live{color:var(--blue);border-color:var(--blue-dim)}
  .mode.bad{color:var(--red);border-color:var(--red)}
  .hi{color:var(--blue);font-variant-numeric:tabular-nums}

  /* hero */
  .hero{flex:1 1 0;min-height:24vh;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.6vh,22px);padding-top:clamp(10px,2vh,28px);padding-bottom:1vh}
  .bubble{
    flex:0 0 auto;position:relative;max-width:88%;text-align:center;
    padding:clamp(8px,1.2vh,16px) clamp(14px,2vh,26px);
    border:1px solid var(--rule);border-radius:14px;background:#ffffff;box-shadow:0 4px 18px rgba(32,33,34,.08);
    font-size:clamp(13px,2vh,26px);font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  }
  .bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;transform:translateX(-50%) rotate(45deg);
    background:inherit;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .bubble .sub{display:block;margin-top:4px;font-size:.55em;font-weight:400;letter-spacing:.18em;color:var(--text-mid);text-transform:uppercase}
  .globe{flex:1 1 0;min-height:0;width:100%;max-height:30vh;position:relative}
  #globe{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* sections */
  section{padding-top:clamp(8px,1.5vh,20px)}
  .label{font-size:clamp(8px,1.1vh,12px);letter-spacing:.24em;color:var(--text-lo);text-transform:uppercase;margin-bottom:clamp(4px,.7vh,8px);display:flex;justify-content:space-between;gap:8px}
  .label .r{color:var(--blue);font-variant-numeric:tabular-nums}

  .tfa{border-left:3px solid var(--blue);padding-left:clamp(10px,1.4vh,18px)}
  .tfa h2{font-size:clamp(20px,3vh,44px);font-weight:400;line-height:1.1}
  .tfa .desc{font-size:clamp(10px,1.25vh,15px);color:var(--text-lo);letter-spacing:.06em;margin-top:3px}
  .tfa p{font-size:clamp(12px,1.6vh,22px);line-height:1.4;color:var(--text-mid);margin-top:clamp(4px,.7vh,10px);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:clamp(8px,1.3vh,16px) 0}
  .cell .k{font-size:clamp(8px,1.05vh,12px);letter-spacing:.2em;color:var(--text-lo);text-transform:uppercase;margin-bottom:2px}
  .cell .v{font-size:clamp(14px,2.4vh,32px);font-weight:700;font-variant-numeric:tabular-nums}
  .cell .v.b{color:var(--blue)}
  .cell .d{font-size:clamp(8px,1vh,12px);letter-spacing:.08em;color:var(--text-lo);font-variant-numeric:tabular-nums;min-height:1.2em}
  .cell .d.up{color:var(--green)} .cell .d.dn{color:var(--amber)}

  .bars{display:flex;align-items:flex-end;gap:clamp(2px,.3vh,5px);height:clamp(40px,6vh,120px)}
  .bars i{flex:1 1 0;display:block;min-height:2px;border-radius:2px 2px 0 0;background:#6b8fd9}
  .bars i.we{background:#b8cbf0}
  .bars i.last{background:#2a4b8d}
  .barfoot{display:flex;justify-content:space-between;font-size:clamp(8px,1vh,11px);color:var(--text-lo);letter-spacing:.14em;margin-top:5px}

  .reads{display:flex;flex-direction:column;gap:clamp(4px,.7vh,10px)}
  .rd{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:clamp(11px,1.5vh,19px)}
  .rd .rk{color:var(--text-lo);flex:0 0 1.2em;font-size:.85em}
  .rd .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .rd svg{flex:0 0 auto;width:clamp(40px,7vw,90px);height:1.2em;overflow:visible}
  .rd .vw{color:var(--blue);flex:0 0 4.5em;text-align:right;font-variant-numeric:tabular-nums;font-size:.85em}
  .rd:nth-child(n+4){opacity:.7}

  .otd{position:relative;min-height:calc(clamp(12px,1.55vh,21px) * 1.4 * 3)}
  .otd div{position:absolute;inset:0;font-size:clamp(12px,1.55vh,21px);line-height:1.4;color:var(--text-mid);
    transition:opacity 1.2s ease, transform 1.2s ease;opacity:0;transform:translateY(6px);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .otd div.on{opacity:1;transform:none}
  .otd b{color:var(--blue);font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;font-weight:700;margin-right:.5em}
  .empty{color:var(--text-lo);font-size:clamp(10px,1.3vh,14px);letter-spacing:.1em}

  footer{padding-top:clamp(8px,1.5vh,18px);padding-bottom:clamp(12px,2.2vh,26px);display:flex;justify-content:space-between;gap:10px;font-size:clamp(8px,1.05vh,12px);letter-spacing:.16em;color:var(--text-lo);text-transform:uppercase}
  @media (max-width:700px){ h1{letter-spacing:.2em} }
  @media (max-height:1100px){ .hero{min-height:20vh} .rd:nth-child(n+5){display:none} }
  @media (prefers-reduced-motion: reduce){ .beacon{animation:none} }
</style>
</head>
<body>
<header class="pad">
  <div class="topline">
    <h1>Wikipedia<span class="slash">&nbsp;//&nbsp;</span>Pulse</h1>
    <div class="clock" id="clock">—</div>
  </div>
  <div class="statusline">
    <span class="beacon"></span>
    <span id="wikiName">ENGLISH WIKIPEDIA</span>
    <span class="mode" id="mode">STARTING</span>
  </div>
  <div class="statusline">
    <span style="width:8px"></span>
    <span style="color:var(--text-lo)">ONE SYNC A DAY · NEXT IN <span class="hi" id="next">—</span></span>
  </div>
</header>

<div class="hero pad">
  <div class="bubble" id="bubble">Gathering the sum of all knowledge…<span class="sub" id="bubsub">articles</span></div>
  <div class="globe"><canvas id="globe"></canvas></div>
</div>

<section class="pad">
  <div class="label"><span>Today's featured article</span><span class="r" id="tfadate"></span></div>
  <div class="tfa">
    <h2 class="serif" id="tfa-title">—</h2>
    <div class="desc" id="tfa-desc"></div>
    <p class="serif" id="tfa-text"></p>
  </div>
</section>

<section class="pad">
  <div class="stats">
    <div class="cell"><div class="k">Views / day</div><div class="v b" id="s-views">—</div><div class="d" id="d-views"></div></div>
    <div class="cell"><div class="k">Edits / day</div><div class="v" id="s-edits">—</div><div class="d" id="d-edits"></div></div>
    <div class="cell"><div class="k">New articles</div><div class="v" id="s-new">—</div><div class="d" id="d-new"></div></div>
    <div class="cell"><div class="k">Active editors</div><div class="v" id="s-active">—</div><div class="d" id="d-active">last 30 days</div></div>
  </div>
</section>

<section class="pad">
  <div class="label"><span>Pageviews per day</span><span class="r" id="barsum">—</span></div>
  <div class="bars" id="bars"></div>
  <div class="barfoot"><span id="barstart"></span><span id="barend">latest</span></div>
</section>

<section class="pad">
  <div class="label"><span>Most read</span><span class="r" id="readdate"></span></div>
  <div class="reads" id="reads"><div class="empty">—</div></div>
</section>

<section class="pad">
  <div class="label"><span>On this day</span><span class="r" id="otdcount"></span></div>
  <div class="otd serif" id="otd"></div>
</section>

<footer class="pad">
  <span id="synced">never synced</span>
  <span id="bytes"></span>
</footer>

<script>
(() => {
  // ---- config ----
  const params = new URLSearchParams(location.search);
  const LANG = (params.get('wiki') || 'enwiki').replace(/wiki$/, '');
  const PROJECT = `${LANG}.wikipedia`;
  const DAY = 864e5;
  const SYNC_HOUR = 6;           // sync at 6am local, so "featured" and "on this day" match the local date
  const RETRY = 36e5;            // after a failed sync, wait an hour
  const KEY = `wiki-pulse-${LANG}-v1`;
  const LANG_NAMES = {en:'English', de:'German', fr:'French', es:'Spanish', ja:'Japanese', zh:'Chinese', it:'Italian', pt:'Portuguese', ru:'Russian', ar:'Arabic'};
  document.getElementById('wikiName').textContent = `${(LANG_NAMES[LANG] || LANG).toUpperCase()} WIKIPEDIA`;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = n => n >= 1e9 ? (n/1e9).toFixed(2)+'B' : n >= 1e6 ? (n/1e6).toFixed(n >= 1e8 ? 0 : 1)+'M' : n >= 1e4 ? (n/1e3).toFixed(n >= 1e5 ? 0 : 1)+'k' : Math.round(n).toLocaleString('en-AU');
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const ymd = t => iso(t).replace(/-/g, '');
  const pad = n => String(n).padStart(2, '0');
  // the local day we sync for — rolls over at SYNC_HOUR
  const dataDay = (t = Date.now()) => { const d = new Date(t - SYNC_HOUR * 36e5); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

  let state = load() || {};
  let syncing = false, retryAt = 0;

  function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  // ---- fetch (once per day: three requests) ----
  async function sync(){
    syncing = true; setMode('SYNCING', 'live');
    const day = dataDay();
    let bytes = 0;
    const get = async url => {
      const r = await fetch(url, {cache:'no-store'});
      const t = await r.text();
      bytes += t.length;
      if (!r.ok) throw new Error(r.status);
      return JSON.parse(t);
    };
    const end = Date.parse(day);
    const urls = {
      stats: `https://${LANG}.wikipedia.org/w/api.php?action=query&meta=siteinfo&siprop=statistics&format=json&origin=*`,
      views: `https://wikimedia.org/api/rest_v1/metrics/pageviews/aggregate/${PROJECT}/all-access/user/daily/${ymd(end - 31*DAY)}/${ymd(end)}`,
      feed:  `https://${LANG}.wikipedia.org/api/rest_v1/feed/featured/${day.replace(/-/g, '/')}`,
    };
    const keys = Object.keys(urls);
    const res = await Promise.allSettled(keys.map(k => get(urls[k])));
    const got = {};
    res.forEach((r, i) => { if (r.status === 'fulfilled') got[keys[i]] = r.value; });
    // "most read" for a day is only published once that day is over in UTC — fall back to the previous day's feed
    if (got.feed && !got.feed.mostread){
      try { got.feed.mostread = (await get(`https://${LANG}.wikipedia.org/api/rest_v1/feed/featured/${iso(end - DAY).replace(/-/g, '/')}`)).mostread; } catch(e){}
    }

    if (got.stats){
      const s = got.stats.query.statistics;
      const snap = {t: Date.now(), articles: s.articles, edits: s.edits, active: s.activeusers};
      // per-day rates come from the difference between two daily snapshots
      const prev = state.snap;
      if (prev && snap.t - prev.t > 6 * 36e5){
        const per = DAY / (snap.t - prev.t);
        state.rates = {edits: (snap.edits - prev.edits) * per, articles: (snap.articles - prev.articles) * per, prevRates: state.rates || null};
      }
      state.snap = snap;
    }
    if (got.views) state.views = (got.views.items || []).map(i => [i.timestamp.slice(0, 8), i.views]);
    if (got.feed){
      const f = got.feed;
      if (f.tfa) state.tfa = {title: f.tfa.titles?.normalized || f.tfa.title, desc: f.tfa.description || '', text: f.tfa.extract || '', day};
      if (f.mostread?.articles?.length) state.reads = {
        date: f.mostread.date,
        items: f.mostread.articles.slice(0, 5).map(a => ({title: a.titles?.normalized || a.title, views: a.views, hist: (a.view_history || []).map(h => h.views)})),
      };
      if (f.onthisday?.length) state.otd = f.onthisday.map(e => ({year: e.year, text: e.text}));
    }

    if (Object.keys(got).length){ state.day = day; state.fetched = Date.now(); state.bytes = bytes; save(); setMode('LIVE', 'live'); }
    else { retryAt = Date.now() + RETRY; setMode('OFFLINE · CACHED', 'bad'); }
    syncing = false;
    render();
  }

  // ---- render ----
  function delta(el, v, p){
    if (p){
      const pct = (v - p) / p * 100;
      el.textContent = `${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}%`;
      el.className = 'd ' + (pct >= 0 ? 'up' : 'dn');
    } else { el.textContent = ''; el.className = 'd'; }
  }

  function render(){
    if (state.snap){
      $('bubble').firstChild.nodeValue = `${state.snap.articles.toLocaleString('en-AU')} articles`;
      $('bubsub').textContent = `${fmt(state.snap.edits)} edits since 2001`;
      $('s-active').textContent = fmt(state.snap.active);
    }
    const R = state.rates;
    if (R){
      $('s-edits').textContent = fmt(R.edits);
      $('s-new').textContent = fmt(R.articles);
      delta($('d-edits'), R.edits, R.prevRates?.edits);
      delta($('d-new'), R.articles, R.prevRates?.articles);
    } else if (state.snap){
      $('d-edits').textContent = $('d-new').textContent = 'after 2nd sync';
    }

    if (state.tfa){
      $('tfa-title').textContent = state.tfa.title;
      $('tfa-desc').textContent = state.tfa.desc;
      $('tfa-text').textContent = state.tfa.text;
      $('tfadate').textContent = new Date(state.tfa.day + 'T00:00:00Z').toLocaleDateString([], {weekday:'short', day:'numeric', month:'short', timeZone:'UTC'});
    }

    if (state.views && state.views.length){
      const V = state.views;
      const max = Math.max(...V.map(v => v[1]));
      const min = Math.min(...V.map(v => v[1])) * .9;
      $('bars').innerHTML = V.map(([d, n], i) => {
        const wd = new Date(`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}T00:00:00Z`).getUTCDay();
        const cls = i === V.length - 1 ? 'last' : (wd === 0 || wd === 6) ? 'we' : '';
        return `<i class="${cls}" style="height:${((n - min) / (max - min || 1) * 90 + 10).toFixed(1)}%"></i>`;
      }).join('');
      const avg = V.reduce((a, v) => a + v[1], 0) / V.length;
      $('barsum').textContent = `avg ${fmt(avg)} / day`;
      $('barstart').textContent = `${V.length} days ago`;
      const last = V[V.length - 1];
      $('barend').textContent = new Date(`${last[0].slice(0,4)}-${last[0].slice(4,6)}-${last[0].slice(6)}T00:00:00Z`).toLocaleDateString([], {day:'numeric', month:'short', timeZone:'UTC'});
      $('s-views').textContent = fmt(last[1]);
      delta($('d-views'), last[1], V[V.length - 2]?.[1]);
    }

    if (state.reads){
      $('readdate').textContent = new Date(state.reads.date.slice(0, 10) + 'T00:00:00Z').toLocaleDateString([], {weekday:'short', day:'numeric', month:'short', timeZone:'UTC'});
      $('reads').innerHTML = state.reads.items.map((a, i) =>
        `<div class="rd"><span class="rk">${i + 1}</span><span class="nm serif">${esc(a.title)}</span>${spark(a.hist)}<span class="vw">${fmt(a.views)}</span></div>`
      ).join('');
    }

    if (state.otd && state.otd.length){
      $('otd').innerHTML = state.otd.map(e => `<div><b>${esc(e.year)}</b>${esc(e.text)}</div>`).join('');
      $('otdcount').textContent = `${state.otd.length} events`;
      otdIdx = -1; rotateOtd();
    }

    if (state.fetched){
      const d = new Date(state.fetched);
      $('synced').textContent = `synced ${d.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'})} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      // wikimedia gzips its JSON ~5x and the browser won't report the wire size cross-origin, so estimate it
      $('bytes').textContent = state.bytes ? `~${(state.bytes/5/1024).toFixed(0)} KB last sync` : '';
    }
  }

  function spark(h){
    if (!h || h.length < 2) return '<svg></svg>';
    const max = Math.max(...h), min = Math.min(...h);
    const pts = h.map((v, i) => `${(i / (h.length - 1) * 100).toFixed(1)},${(20 - (v - min) / (max - min || 1) * 18 - 1).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 100 20" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#3366cc" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
  }

  // "on this day" cycles through the day's events — no network, just the cached list
  let otdIdx = -1;
  function rotateOtd(){
    const items = $('otd').children;
    if (!items.length) return;
    if (items[otdIdx]) items[otdIdx].classList.remove('on');
    otdIdx = (otdIdx + 1) % items.length;
    items[otdIdx].classList.add('on');
  }
  setInterval(rotateOtd, 12000);

  function setMode(txt, cls){ const m = $('mode'); m.textContent = txt; m.className = 'mode ' + (cls || ''); }

  // ---- the globe: letters from many scripts on a slowly turning sphere ----
  const cv = $('globe'), ctx = cv.getContext('2d');
  const GLYPHS = Array.from('WΩИ維ウώვשكवকཝವЖπλжüñßæø가のणعดሰᏔΣДЯ文字ئ語ΦΨΞ한ཀअଓਖખதతമසကកລᐃⴰ');
  const N = 260;
  const pts = [];
  for (let i = 0; i < N; i++){
    // fibonacci sphere: evenly spread points
    const y = 1 - (i + .5) / N * 2, r = Math.sqrt(1 - y*y), th = i * Math.PI * (3 - Math.sqrt(5));
    pts.push({x: Math.cos(th) * r, y, z: Math.sin(th) * r, g: GLYPHS[(i * 13 + (i >> 2)) % GLYPHS.length], pop: -1});
  }
  // the famous missing piece near the top of the globe
  pts.forEach(p => { p.hole = p.y > .62 && p.z > .15 && Math.abs(p.x) < .55; });

  let W = 0, H = 0;
  function size(){
    const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(size).observe(cv);

  const TILT = -.35;
  let lastPop = 0;
  function draw(now){
    ctx.clearRect(0, 0, W, H);
    const R = Math.min(W, H) * .44, cx = W / 2, cy = H / 2;
    const a = now / 1000 * .14;
    const ca = Math.cos(a), sa = Math.sin(a), ct = Math.cos(TILT), st = Math.sin(TILT);

    // ball
    const g = ctx.createRadialGradient(cx - R*.35, cy - R*.4, R*.1, cx, cy, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.7, '#e4e6ea'); g.addColorStop(1, '#c4c8ce');
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();

    // an edit every so often: a random front-facing piece lifts out and gets a new letter
    if (now - lastPop > 1400){
      lastPop = now;
      const p = pts[(Math.random() * N) | 0];
      if (!p.hole) p.pop = now;
    }

    const proj = pts.map(p => {
      const x1 = p.x * ca + p.z * sa, z1 = -p.x * sa + p.z * ca;   // spin about y
      const y2 = p.y * ct - z1 * st, z2 = p.y * st + z1 * ct;      // tilt toward viewer
      return {p, x: x1, y: y2, z: z2};
    }).sort((u, v) => u.z - v.z);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const q of proj){
      if (q.z < 0) continue;
      const p = q.p;
      let lift = 1, hot = 0;
      if (p.pop > 0){
        const t = (now - p.pop) / 1600;
        if (t >= 1){ p.pop = -1; }
        else {
          lift = 1 + Math.sin(t * Math.PI) * .12; hot = Math.sin(t * Math.PI);
          if (t > .5 && !p.swapped){ p.g = GLYPHS[(Math.random() * GLYPHS.length) | 0]; p.swapped = true; }
        }
        if (t < .5) p.swapped = false;
      }
      const x = cx + q.x * R * lift, y = cy - q.y * R * lift;
      if (p.hole) continue;   // the gap where the floating piece belongs
      const fs = R * .13 * (.45 + .55 * q.z) * (1 + hot * .5);
      ctx.font = `600 ${fs.toFixed(1)}px "Linux Libertine", Georgia, "Times New Roman", serif`;
      const shade = Math.round(150 - 120 * q.z);
      ctx.fillStyle = hot > 0 ? `rgba(51,102,204,${.5 + .5 * hot})` : `rgba(${shade},${shade + 2},${shade + 6},${.35 + .65 * q.z})`;
      ctx.fillText(p.g, x, y);
    }

    // a stray piece floating above the gap, bobbing
    const bx = cx + R * .1, by = cy - R * 1.08 + Math.sin(now / 900) * R * .04;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.sin(now / 1300) * .25);
    ctx.font = `600 ${(R * .16).toFixed(1)}px "Linux Libertine", Georgia, serif`;
    ctx.fillStyle = '#3366cc'; ctx.fillText('W', 0, 0);
    ctx.restore();

    requestAnimationFrame(draw);
  }

  // ---- clock / scheduler: no network here, just checks whether a sync is due ----
  function tick(){
    const now = new Date();
    $('clock').textContent = now.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'}).toUpperCase() + '  ' +
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    const due = state.day !== dataDay() && Date.now() >= retryAt;
    const n = new Date(now); n.setHours(SYNC_HOUR, 0, 0, 0);
    if (n <= now) n.setDate(n.getDate() + 1);
    let next = +n;
    if (retryAt > Date.now()) next = retryAt;
    const left = next - Date.now();
    $('next').textContent = syncing || due ? 'now' : `${Math.floor(left/36e5)}h ${pad(Math.floor(left/6e4) % 60)}m`;
    if (!syncing && due && navigator.onLine !== false) sync();
  }

  size();
  if (state.fetched){ setMode('LIVE · CACHED', 'live'); render(); }
  tick();
  setInterval(tick, 1000);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
