<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPARK Launch</title><style>
:root{--c1:#3ef2ff;--c2:#b45cff;--c3:#ff4fd8;--bg:#03010a;font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eafcff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
/* neon grid floor */
.floor{position:fixed;left:-50%;right:-50%;bottom:-10%;height:55%;perspective:420px;pointer-events:none;overflow:hidden}
.floor::before{content:"";position:absolute;inset:0 0 -100% 0;transform:rotateX(68deg);transform-origin:50% 0;background-image:linear-gradient(var(--c2) 2px,transparent 2px),linear-gradient(90deg,var(--c2) 2px,transparent 2px);background-size:80px 80px;opacity:.55;animation:grid 1.4s linear infinite;mask-image:linear-gradient(to bottom,transparent,#000 35%);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 35%)}
@keyframes grid{to{background-position:0 80px}}
.horizon{position:fixed;left:0;right:0;bottom:44%;height:3px;background:linear-gradient(90deg,transparent,var(--c3),var(--c1),var(--c3),transparent);box-shadow:0 0 30px var(--c3),0 0 80px var(--c2);opacity:.8;pointer-events:none}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,#ffffff06 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000c 100%)}
/* HUD */
.hud{position:fixed;font:700 clamp(10px,1.2vw,14px)/1.5 ui-monospace,Consolas,monospace;letter-spacing:2px;color:var(--c1);text-shadow:0 0 8px var(--c1);opacity:.85;pointer-events:none;text-transform:uppercase}
.tl{top:22px;left:22px}.tr{top:22px;right:22px;text-align:right}.bl{bottom:22px;left:22px}.br{bottom:22px;right:22px;text-align:right}
.corner{position:fixed;width:48px;height:48px;border:3px solid var(--c1);filter:drop-shadow(0 0 6px var(--c1));pointer-events:none;opacity:.8}
.c1{top:10px;left:10px;border-right:0;border-bottom:0}.c2{top:10px;right:10px;border-left:0;border-bottom:0}.c3{bottom:10px;left:10px;border-right:0;border-top:0}.c4{bottom:10px;right:10px;border-left:0;border-top:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#39ff88;box-shadow:0 0 10px #39ff88;margin-right:6px;animation:blink 1.2s steps(2) infinite}.dot.off{background:#ff4f6d;box-shadow:0 0 10px #ff4f6d}
@keyframes blink{50%{opacity:.25}}
/* centre */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);padding:16px;text-align:center}
.kicker{font:800 clamp(12px,1.6vw,18px) ui-monospace,Consolas,monospace;letter-spacing:clamp(4px,1vw,10px);color:var(--c1);text-shadow:0 0 12px var(--c1)}
.kicker .type::after{content:"_";animation:blink .8s steps(2) infinite}
.tap{position:relative;width:min(64vmin,92vw,620px);aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent;outline:none}
.ring{position:absolute;inset:0;border-radius:50%}
.r1{background:conic-gradient(from 0deg,var(--c1),transparent 25%,var(--c3) 50%,transparent 75%,var(--c1));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:spin 4s linear infinite;filter:drop-shadow(0 0 14px var(--c1))}
.r2{inset:7%;border:2px dashed #3ef2ff88;animation:spin 18s linear infinite reverse}
.r3{inset:13%;background:conic-gradient(from 90deg,var(--c2) 0 8%,transparent 8% 25%,var(--c2) 25% 33%,transparent 33% 50%,var(--c2) 50% 58%,transparent 58% 75%,var(--c2) 75% 83%,transparent 83%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));animation:spin 9s linear infinite;filter:drop-shadow(0 0 10px var(--c2))}
.core{position:absolute;inset:20%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2a0f5a,#0b0420 70%);box-shadow:inset 0 0 60px #b45cff88,0 0 60px #b45cff66,0 0 140px #3ef2ff33;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:breathe 2.4s ease-in-out infinite;transition:transform .25s}
.tap:hover .core,.tap:focus-visible .core{transform:scale(1.04)}
.tap:active .core{transform:scale(.96)}
.label{font-weight:950;font-size:clamp(46px,11vmin,104px);line-height:.92;letter-spacing:-2px;background:linear-gradient(180deg,#fff 10%,var(--c1) 55%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #3ef2ffaa);position:relative}
.label::before,.label::after{content:attr(data-t);position:absolute;inset:0;background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent}
.label::before{color:var(--c3);-webkit-text-fill-color:var(--c3);opacity:.7;animation:glitch 3s steps(1) infinite;clip-path:inset(0 0 60% 0)}
.label::after{color:var(--c1);-webkit-text-fill-color:var(--c1);opacity:.7;animation:glitch 3s steps(1) infinite reverse;clip-path:inset(55% 0 0 0)}
@keyframes glitch{0%,88%,100%{transform:none}90%{transform:translate(-6px,1px)}93%{transform:translate(5px,-2px)}96%{transform:translate(-3px,0)}}
.arrow{margin-top:clamp(6px,1.5vmin,14px);font:800 clamp(12px,2.2vmin,18px) ui-monospace,Consolas,monospace;letter-spacing:4px;color:var(--c1);opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{box-shadow:inset 0 0 80px #b45cffaa,0 0 90px #b45cff99,0 0 180px #3ef2ff55}}
.dest{font:700 clamp(13px,1.8vw,20px) ui-monospace,Consolas,monospace;letter-spacing:3px;color:#cfe9ff;text-shadow:0 0 10px var(--c2)}
.dest b{color:var(--c3)}
.msg{min-height:1.4em;font:800 clamp(14px,1.8vw,20px) ui-monospace,Consolas,monospace;letter-spacing:1px;color:#ffd0f4}
.msg a{color:var(--c1)}
/* launch */
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,#3ef2ff 40%,transparent 70%);opacity:0;pointer-events:none;transition:opacity .5s}
body.launch .flash{opacity:1;transition-delay:1s}
body.launch .tap .core{animation:none;transform:scale(1.3);transition:transform 1.2s cubic-bezier(.6,0,.9,.4)}
body.launch .r1,body.launch .r3{animation-duration:.5s}
body.launch .floor::before{animation-duration:.25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<canvas id="stars"></canvas>
<div class="horizon"></div><div class="floor"></div><div class="scan"></div><div class="vignette"></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
<div class="hud tl">SPARK // LAUNCH PAD<br>NODE: USB-01</div>
<div class="hud tr"><span id="clock">--:--</span><br><span id="date"></span></div>
<div class="hud bl"><span class="dot" id="netdot"></span><span id="net">NETWORK: CHECKING</span><br>LINK: STANDBY</div>
<div class="hud br">SYS 100%<br>WARP DRIVE READY</div>
<main class="stage">
 <div class="kicker"><span class="type" id="type"></span></div>
 <button class="tap" id="tap" aria-label="Tap here to open the SPARK Centre website">
  <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
  <span class="core"><span class="label" data-t="TAP">TAP</span><span class="label" data-t="HERE">HERE</span><span class="arrow">▶ LAUNCH ◀</span></span>
 </button>
 <div class="dest">DESTINATION: <b id="destText"></b></div>
 <div class="msg" id="msg" aria-live="polite"></div>
</main>
<div class="flash"></div>
<script>
// Where the button goes. Change this one line to point somewhere else.
const DEST='https://structurevault.github.io/';
const OFFLINE_COPY='site/index.html';

document.getElementById('destText').textContent=DEST.replace(/^https?:\/\//,'').replace(/\/$/,'');

// Warp starfield
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');let W,H,stars=[],speed=2,target=2;
function size(){const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d}
size();addEventListener('resize',size);
for(let i=0;i<700;i++)stars.push({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random(),h:Math.random()<.5?190:Math.random()<.5?280:315});
function frame(){speed+=(target-speed)*.04;ctx.fillStyle=speed>8?'rgba(3,1,10,.25)':'rgba(3,1,10,.55)';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H*.46,f=Math.min(W,H)*.6;
 for(const s of stars){const pz=s.z;s.z-=.0015*speed;if(s.z<=.01){s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;s.z=1;continue}
  const x=cx+s.x/s.z*f,y=cy+s.y/s.z*f,px=cx+s.x/pz*f,py=cy+s.y/pz*f;if(x<0||x>W||y<0||y>H){s.z=1;continue}
  const a=Math.min(1,(1-s.z)*1.6);ctx.strokeStyle=`hsla(${s.h},100%,75%,${a})`;ctx.lineWidth=(1-s.z)*3+.4;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke()}
 requestAnimationFrame(frame)}
frame();

// Typing kicker
const lines=['SPARK CENTRE ONLINE','LINK ESTABLISHED','READY FOR LAUNCH'];let li=0,ci=0,del=false;const tEl=document.getElementById('type');
(function typeLoop(){const L=lines[li];if(!del){ci++;if(ci>L.length){del=true;return setTimeout(typeLoop,1600)}}else{ci--;if(ci===0){del=false;li=(li+1)%lines.length}}tEl.textContent=L.slice(0,ci);setTimeout(typeLoop,del?35:75)})();

// Clock + network
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('en-AU',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
tick();setInterval(tick,1000);
function net(){const on=navigator.onLine;document.getElementById('net').textContent='NETWORK: '+(on?'ONLINE':'OFFLINE');document.getElementById('netdot').classList.toggle('off',!on)}
net();addEventListener('online',net);addEventListener('offline',net);

// Launch
const msg=document.getElementById('msg');let launching=false;
document.getElementById('tap').onclick=()=>{
 if(launching)return;
 if(!navigator.onLine){msg.innerHTML=`⚠ NO INTERNET. Connect to wifi and tap again, or <a href="${OFFLINE_COPY}">open the offline copy</a>.`;return}
 launching=true;msg.textContent='ENGAGING WARP DRIVE…';target=40;document.body.classList.add('launch');
 setTimeout(()=>{location.href=DEST},1500);
};
// If they come back with the Back button, reset the launch
addEventListener('pageshow',()=>{launching=false;target=2;document.body.classList.remove('launch');msg.textContent=''});
</script></body></html>
