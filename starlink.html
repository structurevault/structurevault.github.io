<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>STARLINK // LIVE ORBITAL DISPLAY</title>
<style>
  :root{
    --bg-deep:#070304;
    --bg-mid:#12060a;
    --red-core:#ff3b30;
    --red-hot:#ff6f61;
    --red-dim:#7e2a26;
    --land:#4d3236;
    --grid:rgba(255,90,80,.07);
    --text-hi:#ffd9d3;
    --text-mid:#b07a74;
    --text-lo:#6e4a48;
    --rule:rgba(255,90,80,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 65% at 50% 42%, var(--bg-mid) 0%, var(--bg-deep) 62%, #030102 100%);
    color:var(--text-hi);
    font-family:"JetBrains Mono","Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    display:flex;flex-direction:column;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  header{
    padding:clamp(14px,2.6vh,28px) clamp(16px,4vw,32px) 0;
    display:flex;flex-direction:column;gap:6px;
  }
  .topline{display:flex;justify-content:space-between;align-items:baseline}
  h1{
    font-size:clamp(15px,2.1vh,22px);
    font-weight:700;letter-spacing:.42em;text-transform:uppercase;
    color:var(--text-hi);white-space:nowrap;
  }
  h1 .slash{color:var(--red-core);font-weight:400}
  .utc{font-size:clamp(10px,1.4vh,13px);color:var(--text-mid);letter-spacing:.12em;font-variant-numeric:tabular-nums}
  .statusline{display:flex;align-items:center;gap:10px;font-size:clamp(10px,1.4vh,13px);letter-spacing:.14em;color:var(--text-mid)}
  .beacon{width:7px;height:7px;border-radius:50%;background:var(--red-core);box-shadow:0 0 8px var(--red-core);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .sitelink{margin-top:2px}
  .sitedot{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--red-hot);box-shadow:0 0 6px rgba(255,111,97,.6)}
  .count{color:var(--red-hot);font-weight:700;font-variant-numeric:tabular-nums}
  .mode{padding:1px 7px;border:1px solid var(--rule);border-radius:2px;font-size:.85em;color:var(--text-lo)}
  .mode.live{color:var(--red-hot);border-color:var(--red-dim)}
  main{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas.dragging{cursor:grabbing}
  footer{
    padding:0 clamp(16px,4vw,32px) clamp(14px,2.6vh,26px);
  }
  .telemetry{
    border-top:1px solid var(--rule);
    padding-top:clamp(10px,1.6vh,16px);
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px clamp(10px,3vw,24px);
  }
  .cell .k{font-size:clamp(8px,1.1vh,10px);letter-spacing:.24em;color:var(--text-lo);text-transform:uppercase;margin-bottom:3px}
  .cell .v{font-size:clamp(11px,1.6vh,15px);color:var(--text-mid);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .v b{color:var(--text-hi);font-weight:500}
  .hint{margin-top:clamp(8px,1.4vh,12px);font-size:clamp(9px,1.2vh,11px);letter-spacing:.18em;color:var(--text-lo);text-transform:uppercase;text-align:center}
  @media (prefers-reduced-motion: reduce){ .beacon{animation:none} }
</style>
</head>
<body>
<header>
  <div class="topline">
    <h1>Starlink<span class="slash">&nbsp;//&nbsp;</span>Orbit</h1>
    <div class="utc" id="utc">—</div>
  </div>
  <div class="statusline">
    <span class="beacon" id="beacon"></span>
    <span><span class="count" id="count">····</span> OBJECTS ON ORBIT</span>
    <span class="mode" id="mode">ACQUIRING</span>
  </div>
  <div class="statusline sitelink">
    <span class="sitedot"></span>
    <span>BONEO GROUND SITE · <span class="count" id="link">·</span> IN VIEW ≥25° ELEV</span>
  </div>
</header>
<main><canvas id="cv"></canvas></main>
<footer>
  <div class="telemetry">
    <div class="cell"><div class="k">Shell altitude</div><div class="v" id="alt">—</div></div>
    <div class="cell"><div class="k">Ephemeris</div><div class="v" id="src">CELESTRAK GP</div></div>
    <div class="cell"><div class="k">Epoch age</div><div class="v" id="epoch">—</div></div>
  </div>
  <div class="hint">drag to steer · release to resume rotation</div>
</footer>

  }
  sats = list; nSats = list.length;
  pos = new Float32Array(nSats*3).fill(9);
  elv = new Float32Array(nSats).fill(-1);
  live = false; epochMs = Date.now();
  minAlt = 530; maxAlt = 570;
  $('mode').textContent = 'SIMULATED';
  $('src').innerHTML = '<b>MODEL</b> · NO LINK';
  $('alt').innerHTML = '<b>530–570</b> KM LEO';
  setCount(nSats);
}

/* sin(elevation) of a sat (earth-fixed lat/lon, radius rr) from the site */
function siteElev(lat, lon, rr){
  const cl = Math.cos(lat);
  const px = cl*Math.sin(lon)*rr, py = Math.sin(lat)*rr, pz = cl*Math.cos(lon)*rr;
  const dx = px-SITE[0], dy = py-SITE[1], dz = pz-SITE[2];
  const dm = Math.sqrt(dx*dx+dy*dy+dz*dz);
  return (dx*SITE[0]+dy*SITE[1]+dz*SITE[2])/dm;
}

/* propagate a slice each frame */
function propagateChunk(now){
  if(!nSats) return;
  const chunk = Math.max(60, Math.ceil(nSats/40));
  if(live){
    const gmst = satellite.gstime(now);
    for(let c=0;c<chunk;c++){
      const idx = cursor; cursor = (cursor+1)%nSats;
      const s = sats[idx];
      try{
        const pv = satellite.propagate(s.rec, now);
        if(!pv || !pv.position){ pos[idx*3]=9; continue; }
        const g = satellite.eciToGeodetic(pv.position, gmst);
        pos[idx*3]   = g.latitude;
        pos[idx*3+1] = g.longitude;
        const rr = 1 + g.height/EARTH_R;
        pos[idx*3+2] = rr;
        elv[idx] = siteElev(g.latitude, g.longitude, rr);
        if(g.height>100 && g.height<2500){
          if(g.height<minAlt) minAlt=g.height;
          if(g.height>maxAlt) maxAlt=g.height;
        }
      }catch(e){ pos[idx*3]=9; }
    }
  }else{
    const t = (now.getTime()-epochMs)/1000;
    const th = t*7.2921159e-5; // earth rotation
    for(let c=0;c<chunk;c++){
      const idx = cursor; cursor = (cursor+1)%nSats;
      const s = sats[idx];
      const u = s.u0 + s.n*t;
      const su=Math.sin(u), cu=Math.cos(u), si=Math.sin(s.i), ci=Math.cos(s.i);
      const lat = Math.asin(si*su);
      const lon = ((s.raan + Math.atan2(ci*su, cu) - th) % (2*Math.PI));
      pos[idx*3]=lat; pos[idx*3+1]=lon; pos[idx*3+2]=s.rr;
      elv[idx] = siteElev(lat, lon, s.rr);
    }
  }
}

/* ---- view / interaction ---- */
let rotX = 0;                     // view longitude (rad)
let tilt = -14*D2R;               // slight tilt so poles show
let autoSpeed = (reduceMotion? 0.008 : 0.035)*D2R*60; // rad per second-ish
let vel = 0, dragging = false, lastX=0, lastY=0, lastT=0;

cv.addEventListener('pointerdown', e=>{
  dragging = true; cv.classList.add('dragging');
  lastX=e.clientX; lastY=e.clientY; lastT=performance.now(); vel=0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  const t = performance.now();
  rotX += dx/R*0.9;
  tilt = Math.max(-70*D2R, Math.min(70*D2R, tilt - dy/R*0.9));
  vel = (dx/R*0.9)/Math.max(16,(t-lastT))*1000;
  lastX=e.clientX; lastY=e.clientY; lastT=t;
});
function endDrag(){ dragging=false; cv.classList.remove('dragging'); }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* pre-rendered red dot sprite */
function makeSprite(size, core, glow){
  const s = document.createElement('canvas');
  const px = size*DPR;
  s.width = px; s.height = px;
  const g = s.getContext('2d');
  const grd = g.createRadialGradient(px/2,px/2,0,px/2,px/2,px/2);
  grd.addColorStop(0, core);
  grd.addColorStop(0.35, glow);
  grd.addColorStop(1, 'rgba(255,59,48,0)');
  g.fillStyle = grd;
  g.fillRect(0,0,px,px);
  return s;
}
const spriteFront = makeSprite(7, '#ffe4e0', 'rgba(255,79,64,.85)');
const spriteLink  = makeSprite(11, '#ffffff', 'rgba(255,150,120,.95)');
const spriteBack  = makeSprite(5, 'rgba(160,45,40,.55)', 'rgba(120,30,26,.28)');

/* ---- render ---- */
let lastFrame = performance.now();
function frame(){
  const nowP = performance.now();
  const dt = Math.min(100, nowP-lastFrame)/1000;
  lastFrame = nowP;
  const now = new Date();

  if(!dragging){
    if(Math.abs(vel) > 0.02){ rotX += vel*dt; vel *= Math.pow(0.05, dt); }
    else rotX += autoSpeed*dt;
  }

  propagateChunk(now);

  ctx.clearRect(0,0,W,H);

  const sT=Math.sin(tilt), cT=Math.cos(tilt);
  const sR=Math.sin(rotX), cR=Math.cos(rotX);

  // limb glow + sphere shading
  let g = ctx.createRadialGradient(CX,CY,R*0.55,CX,CY,R*1.18);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.82,'rgba(255,60,48,0.05)');
  g.addColorStop(0.92,'rgba(255,70,55,0.10)');
  g.addColorStop(1,'rgba(255,70,55,0)');
  ctx.fillStyle=g; ctx.fillRect(CX-R*1.3,CY-R*1.3,R*2.6,R*2.6);

  g = ctx.createRadialGradient(CX-R*0.25,CY-R*0.3,R*0.1,CX,CY,R);
  g.addColorStop(0,'#1c0d10');
  g.addColorStop(0.75,'#120709');
  g.addColorStop(1,'#0c0406');
  ctx.beginPath(); ctx.arc(CX,CY,R,0,7); ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(255,90,75,.22)'; ctx.lineWidth=1; ctx.stroke();

  // graticule
  ctx.strokeStyle = 'rgba(255,90,80,.06)';
  ctx.lineWidth = 1;
  for(let latd=-60; latd<=60; latd+=30){
    ctx.beginPath();
    let started=false;
    for(let lond=-180; lond<=180; lond+=6){
      const p = project(latd*D2R, lond*D2R, 1, sT,cT,sR,cR);
      if(p && p[2]>0){ if(!started){ctx.moveTo(p[0],p[1]);started=true;} else ctx.lineTo(p[0],p[1]); }
      else started=false;
    }
    ctx.stroke();
  }

  // satellites behind globe first
  const front=[];
  let links = 0;
  if(pos){
    for(let i=0;i<nSats;i++){
      const lat=pos[i*3]; if(lat===9) continue;
      const lon=pos[i*3+1], rr=pos[i*3+2];
      const linked = elv[i] >= MIN_EL;
      if(linked) links++;
      const p = projectR(lat,lon,rr,sT,cT,sR,cR);
      if(p[2] < 0){
        const d = Math.hypot(p[0]-CX,p[1]-CY);
        if(d < R) continue;                 // occluded by earth
        ctx.drawImage(spriteBack, p[0]-2.5, p[1]-2.5, 5, 5);
      } else front.push(p[0],p[1],linked?1:0);
    }
  }
  linkCount = links;
  const sitePt = project(SITE_LAT, SITE_LON, 1.004, sT,cT,sR,cR);
  const siteVisible = sitePt[2] > 0.02;

  // land stipple (visible hemisphere)
  ctx.fillStyle = '#503438';
  for(let i=0;i<NL;i++){
    const x=landV[i*3], y=landV[i*3+1], z=landV[i*3+2];
    const x1 =  x*cR - z*sR;
    const z1 =  x*sR + z*cR;
    const y2 =  y*cT - z1*sT;
    const z2 =  y*sT + z1*cT;
    if(z2 <= 0.02) continue;
    const fade = 0.35 + 0.65*z2;
    ctx.globalAlpha = fade;
    const px = CX + x1*R, py = CY - y2*R;
    ctx.fillRect(px-0.75, py-0.75, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;

  // link lines from Boneo to connected satellites
  if(siteVisible){
    ctx.strokeStyle = 'rgba(255,120,95,.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0;i<front.length;i+=3){
      if(front[i+2]){
        ctx.moveTo(sitePt[0], sitePt[1]);
        ctx.lineTo(front[i], front[i+1]);
      }
    }
    ctx.stroke();
  }

  // satellites in front (linked ones burn brighter)
  for(let i=0;i<front.length;i+=3){
    if(front[i+2]) ctx.drawImage(spriteLink, front[i]-5.5, front[i+1]-5.5, 11, 11);
    else ctx.drawImage(spriteFront, front[i]-3.5, front[i+1]-3.5, 7, 7);
  }

  // ground site marker
  if(siteVisible){
    const t2 = nowP/1000;
    const ringR = 5 + 3.5*(0.5+0.5*Math.sin(t2*2.4));
    ctx.strokeStyle = 'rgba(255,180,160,.9)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sitePt[0], sitePt[1], 3, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,120,95,'+(0.7-0.5*((ringR-5)/3.5)).toFixed(2)+')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(sitePt[0], sitePt[1], ringR, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,217,211,.95)';
    ctx.font = '600 10px ui-monospace,Menlo,Consolas,monospace';
    ctx.textAlign = 'left';
    ctx.fillText('BONEO', sitePt[0]+11, sitePt[1]+3);
  }

  // HUD updates ~2Hz
  if((nowP|0) % 500 < 17) hud(now);

  requestAnimationFrame(frame);
}

function project(lat,lon,rr,sT,cT,sR,cR){
  const cl=Math.cos(lat);
  const x=cl*Math.sin(lon)*rr, y=Math.sin(lat)*rr, z=cl*Math.cos(lon)*rr;
  const x1=x*cR - z*sR, z1=x*sR + z*cR;
  const y2=y*cT - z1*sT, z2=y*sT + z1*cT;
  return [CX+x1*R, CY-y2*R, z2];
}
function projectR(lat,lon,rr,sT,cT,sR,cR){ return project(lat,lon,rr,sT,cT,sR,cR); }

let hudTick=0;
function hud(now){
  $('link').textContent = linkCount;
  $('utc').textContent = now.toISOString().slice(0,19).replace('T',' ')+' UTC';
  if(live){
    if(maxAlt>0) $('alt').innerHTML = '<b>'+Math.round(minAlt)+'–'+Math.round(maxAlt)+'</b> KM LEO';
    const ageH = (Date.now()-epochMs)/3600000;
    $('epoch').innerHTML = '<b>'+(ageH<48? ageH.toFixed(1)+'</b> H' : (ageH/24).toFixed(1)+'</b> D')+' OLD';
  } else {
    $('epoch').innerHTML = '<b>T+'+((Date.now()-epochMs)/60000).toFixed(0)+'</b> MIN';
  }
}

/* ---- data acquisition ---- */
const SOURCES = [
  'https://celestrak.org/NORAD/elements/supplemental/sup-gp.php?FILE=starlink&FORMAT=tle',
  'https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle',
  'https://celestrak.com/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle'
];
async function acquire(){
  for(const url of SOURCES){
    try{
      const res = await fetch(url, {mode:'cors'});
      if(!res.ok) continue;
      const text = await res.text();
      ingestTLE(text);
      return;
    }catch(e){ /* next source */ }
  }
  buildSim();
}

buildSim();            // instant picture while fetching
$('mode').textContent = 'ACQUIRING';
acquire();
requestAnimationFrame(frame);

/* refresh TLEs every 2h while left running */
setInterval(()=>{ if(navigator.onLine) acquire(); }, 2*3600*1000);
})();
</script>
