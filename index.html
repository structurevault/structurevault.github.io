<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SPARK Centre — Explore</title><meta name="description" content="Touch-screen launcher for every StructureVault page."><style>
:root{font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;--bg:#0d0b1d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#2b2160,#0d0b1d 70%) fixed;user-select:none}
header{display:flex;align-items:center;gap:24px;padding:28px 40px 10px;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(34px,4vw,64px);font-weight:950;letter-spacing:-2px;line-height:1}
header h1 span{background:linear-gradient(90deg,#ffcf4d,#ff7a59,#c46bff,#4db8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:6px 0 0;font-size:clamp(16px,1.5vw,24px);color:#c9c2f0}
#clock{margin-left:auto;text-align:right;font-weight:900;font-size:clamp(28px,3vw,52px);line-height:1}#clock small{display:block;font-size:.4em;color:#c9c2f0;font-weight:700;margin-top:6px}
nav{display:flex;gap:12px;padding:14px 40px 6px;flex-wrap:wrap}
nav button{border:2px solid #4b4390;background:#1c1840;color:#fff;font-family:inherit;font-weight:900;font-size:clamp(17px,1.4vw,24px);padding:14px 26px;border-radius:40px;cursor:pointer;touch-action:manipulation}
nav button.on{background:#fff;color:#1c1840;border-color:#fff;box-shadow:0 0 30px #ffffff55}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(240px,19vw,360px),1fr));gap:clamp(14px,1.4vw,26px);padding:18px 40px 120px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(190px,15vw,280px);padding:22px 24px;border-radius:30px;border:2px solid #ffffff30;color:#fff;text-decoration:none;overflow:hidden;cursor:pointer;touch-action:manipulation;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:0 14px 40px #0008,inset 0 1px #ffffff40;transition:transform .12s,box-shadow .12s,opacity .3s;animation:pop .45s backwards}
.tile:active{transform:scale(.96);box-shadow:0 4px 14px #0008}
.tile .ic{position:absolute;top:14px;right:18px;font-size:clamp(64px,5.5vw,104px);line-height:1;filter:drop-shadow(0 8px 10px #0006)}
.tile h2{margin:0;font-size:clamp(23px,1.8vw,34px);font-weight:950;letter-spacing:-.5px;line-height:1.05;max-width:80%;text-shadow:0 2px 8px #0005}
.tile p{margin:8px 0 0;font-size:clamp(15px,1.1vw,19px);color:#ffffffe0;font-weight:650;line-height:1.3;text-shadow:0 1px 4px #0005}
.badge{position:absolute;top:18px;left:20px;font-size:14px;font-weight:950;letter-spacing:1px;padding:5px 12px;border-radius:20px;background:#000a;border:1px solid #ffffff50}
.badge.live::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#4be27a;box-shadow:0 0 8px #4be27a;margin-right:7px;vertical-align:0;animation:blink 1.4s infinite}
.tile.hide{display:none}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}}@keyframes blink{50%{opacity:.3}}
/* page viewer: opens a page full-screen with a big Home button */
#viewer{position:fixed;inset:0;z-index:50;background:#000;display:none}#viewer.open{display:block}
#viewer iframe{width:100%;height:100%;border:0;display:block}
#home{position:fixed;z-index:60;top:16px;left:16px;display:none;align-items:center;gap:10px;border:3px solid #fff;background:#1c1840e6;color:#fff;font-family:inherit;font-weight:950;font-size:22px;padding:12px 22px 12px 16px;border-radius:40px;cursor:pointer;box-shadow:0 8px 30px #000a;touch-action:manipulation;backdrop-filter:blur(6px)}
#home.show{display:flex}#home:active{transform:scale(.95)}#home b{font-size:30px;line-height:1}
#fs{position:fixed;right:22px;bottom:20px;z-index:40;border:2px solid #4b4390;background:#1c1840e6;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:13px 20px;border-radius:20px;cursor:pointer}
footer{position:fixed;left:40px;bottom:24px;color:#8f88c0;font-size:15px;pointer-events:none}
@media(prefers-reduced-motion:reduce){.tile{animation:none}}
@media(max-width:600px){header,nav{padding-left:16px;padding-right:16px}main{padding:14px 16px 110px}#clock{display:none}footer{display:none}}
</style></head><body>
<header><div><h1>⚡ <span>SPARK Centre</span></h1><p>Tap a tile to explore. Tap 🏠 HOME to come back.</p></div><div id="clock"></div></header>
<nav id="filters"></nav>
<main id="grid"></main>
<div id="viewer"><iframe id="frame" title="Page" allow="fullscreen; autoplay; geolocation"></iframe></div>
<button id="home" aria-label="Back to all pages"><b>🏠</b> HOME</button>
<button id="fs">⛶ Full screen</button>
<footer>structurevault.github.io</footer>
<script>
// To add a page: add one line here. cat = filter group, live = shows a LIVE badge.
const PAGES=[
 {f:'ip-port.html',t:'IP + Port = npub',d:'Type an IP address and port to find a nostrich',i:'⌨️',cat:'Networks & Security',a:'#3fa9ff',b:'#7c1546'},
 {f:'nostr-fridges.html',t:'Nostr Fridge Network',d:'Hacked supermarket fridges try to fake a nostrich message',i:'🌡️',cat:'Bitcoin & Nostr',a:'#d1452f',b:'#3a1166'},
 {f:'hacks.html',t:'Hacks',d:'Videos about real cyber attacks in the news',i:'🚨',cat:'Networks & Security',a:'#1fae63',b:'#3a0d16'},
 {f:'bitcoin.html',t:'Bitcoin Mempool',d:'Watch real transactions wait for miners',i:'₿',cat:'Bitcoin & Nostr',live:1,a:'#f7931a',b:'#7a3a05'},
 {f:'mempool.html',t:'Block Flow',d:'Bitcoin blocks stacking up the chain',i:'🧱',cat:'Bitcoin & Nostr',live:1,a:'#8a3bd8',b:'#2e39d1'},
 {f:'clock.html',t:'Debt Clock',d:'Australia’s debt ticking + BTC converter',i:'⏱️',cat:'Bitcoin & Nostr',live:1,a:'#e0a21a',b:'#5c3b00'},
 {f:'nostr.html',t:'Nostr Network',d:'Nostriches send signed messages via relays',i:'🪶',cat:'Bitcoin & Nostr',a:'#a24ae8',b:'#3a1166'},
 {f:'nostr-signin.html',t:'Nostr Terminal',d:'Sign in with keys, hacker style',i:'💻',cat:'Bitcoin & Nostr',a:'#5b2b8f',b:'#120a24'},
 {f:'vault.html',t:'Nostr × Minecraft',d:'The StructureVault home base',i:'🏰',cat:'Minecraft',a:'#4c9a3b',b:'#6a2bb0'},
 {f:'minecraft.html',t:'Minecraft Live',d:'What’s happening on the server now',i:'⛏️',cat:'Minecraft',live:1,a:'#5aa83a',b:'#1f4a14'},
 {f:'structure.html',t:'Structure Forge',d:'View Minecraft builds in 3D',i:'🧊',cat:'Minecraft',a:'#3e9c8f',b:'#123f3a'},
 {f:'arcademachine.html',t:'SPARK Arcade',d:'Step up to the arcade machine',i:'🕹️',cat:'Games',a:'#ff4fa3',b:'#5b0f6e'},
 {f:'arcade2.html',t:'Cartridge Library',d:'Pick a game cartridge to play',i:'💾',cat:'Games',a:'#ff6a3d',b:'#6e1730'},
 {f:'hockey.html',t:'Air Hockey',d:'Two players, one screen — go!',i:'🏒',cat:'Games',a:'#22b8e8',b:'#0b3a6e'},
 {f:'slice.html',t:'Fruit Slicer',d:'Swipe fast to slice the fruit',i:'🍉',cat:'Games',a:'#ff4a5d',b:'#2f8a2a'},
 {f:'starlink.html',t:'Starlink Live',d:'Satellites orbiting Earth right now',i:'🛰️',cat:'Live Data',live:1,a:'#2b6cff',b:'#071a4a'},
 {f:'earthquakes.html',t:'Earthquakes',d:'Quakes happening around the world',i:'🌏',cat:'Live Data',live:1,a:'#e85d2a',b:'#4a1406'},
 {f:'weather.html',t:'Boneo Weather',d:'Today’s weather at our school',i:'⛅',cat:'Live Data',live:1,a:'#38a8f5',b:'#0f4c7a'},
 {f:'wikipedia.html',t:'Wikipedia Pulse',d:'Edits flowing in from everywhere',i:'📚',cat:'Live Data',live:1,a:'#7d8796',b:'#1e2430'},
 {f:'heartbeat.html',t:'GitHub Pulse',d:'Code being shared around the world',i:'🐙',cat:'Live Data',live:1,a:'#3f4a5c',b:'#0d1117'},
 {f:'hb.html',t:'Internet Heartbeat',d:'BGP routes that hold the internet together',i:'💓',cat:'Live Data',live:1,a:'#e8335a',b:'#2a0614'},
 {f:'network.html',t:'Network Map',d:'How the SPARK Centre is connected',i:'🗺️',cat:'Networks & Security',a:'#19b3a6',b:'#0b3d4a'},
 {f:'network-big.html',t:'Network Map (Big)',d:'The network map for the big screen',i:'🖥️',cat:'Networks & Security',a:'#1a8fb3',b:'#082c4a'},
 {f:'dmz.html',t:'DMZ Castle',d:'Firewalls, allowed traffic and gaps',i:'🛡️',cat:'Networks & Security',a:'#c9473a',b:'#3a1410'},
 {f:'dmz-keys.html',t:'DMZ Keys',d:'Each server gets its own key pair',i:'🔑',cat:'Networks & Security',a:'#b8862a',b:'#3a2408'},
 {f:'vc.html',t:'Castle Version Control',d:'Save, branch and merge your castle',i:'🏯',cat:'Networks & Security',a:'#6b5bd6',b:'#1b1550'},
 {f:'version-control.html',t:'Version Control (Classic)',d:'The original castle versions',i:'📜',cat:'Networks & Security',a:'#5a4fb0',b:'#17123a'},
 {f:'rtbt.html',t:'Castle Defence',d:'Red vs Blue version board',i:'⚔️',cat:'Networks & Security',a:'#d8344a',b:'#1f4fb8'},
 {f:'art.html',t:'360 Gallery',d:'Our students’ artwork',i:'🎨',cat:'School',a:'#f2a33a',b:'#b8346b'},
 {f:'robot.html',t:'Name Our Robots',d:'Vote for the robot names',i:'🤖',cat:'School',a:'#38c9c0',b:'#255a9c'},
 {f:'tpe.html',t:'Think · Puzzle · Explore',d:'The live wall of big questions',i:'💡',cat:'School',live:1,a:'#f5c935',b:'#c4511e'},
];
const grid=document.getElementById('grid'),filters=document.getElementById('filters');
const ORDER=['Bitcoin & Nostr','Minecraft','Games','Live Data','Networks & Security','School'];
const cats=['All',...new Set([...ORDER,...PAGES.map(p=>p.cat)].filter(c=>PAGES.some(p=>p.cat===c)))];let cat='All';
cats.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{cat=c;render();try{sessionStorage.setItem('cat',c)}catch(e){}};filters.appendChild(b)});
PAGES.forEach((p,n)=>{const a=document.createElement('a');a.className='tile';a.href=p.f;a.dataset.cat=p.cat;a.style.setProperty('--a',p.a);a.style.setProperty('--b',p.b);a.style.animationDelay=(n*25)+'ms';
 a.innerHTML=`${p.live?'<span class="badge live">LIVE</span>':''}<span class="ic">${p.i}</span><h2>${p.t}</h2><p>${p.d}</p>`;
 a.onclick=e=>{e.preventDefault();open(p.f)};grid.appendChild(a)});
function render(){[...filters.children].forEach(b=>b.classList.toggle('on',b.textContent===cat));grid.querySelectorAll('.tile').forEach(t=>t.classList.toggle('hide',cat!=='All'&&t.dataset.cat!==cat))}
try{const c=sessionStorage.getItem('cat');if(c&&cats.includes(c))cat=c}catch(e){}render();

// open pages inside a full-screen frame so the HOME button is always there
const viewer=document.getElementById('viewer'),frame=document.getElementById('frame'),home=document.getElementById('home');
function open(f,push=true){frame.src=f;viewer.classList.add('open');home.classList.add('show');document.body.style.overflow='hidden';if(push)history.pushState({f},'','#'+f.replace('.html',''))}
function close(push=true){viewer.classList.remove('open');home.classList.remove('show');frame.src='about:blank';document.body.style.overflow='';if(push&&location.hash)history.pushState({},'',location.pathname)}
home.onclick=()=>close();
addEventListener('popstate',()=>{const h=location.hash.slice(1);h?open(h+'.html',false):close(false)});
if(location.hash){const f=location.hash.slice(1)+'.html';if(PAGES.some(p=>p.f===f))open(f,false)}

document.getElementById('fs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
const clock=document.getElementById('clock');function tick(){const d=new Date();clock.innerHTML=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})+'<small>'+d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})+'</small>'}tick();setInterval(tick,10000);
</script></body></html>
