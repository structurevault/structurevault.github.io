<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BGP // HEARTBEAT — LIVE GLOBAL ROUTING</title>
<style>
  :root{
    --bg-deep:#040302;
    --bg-mid:#0e0903;
    --amber:#ffa02e;
    --amber-hot:#ffd9a0;
    --amber-dim:#8a5a1e;
    --wd-red:#ff4b3e;
    --land:#4a3d2c;
    --text-hi:#ffe9cf;
    --text-mid:#b08d5e;
    --text-lo:#6e5638;
    --rule:rgba(255,160,46,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 60% at 50% 34%, var(--bg-mid) 0%, var(--bg-deep) 60%, #020101 100%);
    color:var(--text-hi);
    font-family:"JetBrains Mono","Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    display:flex;flex-direction:column;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  header{padding:clamp(14px,2.4vh,26px) clamp(16px,4vw,32px) 0;display:flex;flex-direction:column;gap:6px}
  .topline{display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:clamp(15px,2.1vh,22px);font-weight:700;letter-spacing:.42em;text-transform:uppercase;white-space:nowrap}
  h1 .slash{color:var(--amber);font-weight:400}
  .utc{font-size:clamp(10px,1.4vh,13px);color:var(--text-mid);letter-spacing:.12em;font-variant-numeric:tabular-nums}
  .statusline{display:flex;align-items:center;gap:10px;font-size:clamp(10px,1.4vh,13px);letter-spacing:.14em;color:var(--text-mid)}
  .beacon{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .count{color:var(--amber);font-weight:700;font-variant-numeric:tabular-nums}
  .mode{padding:1px 7px;border:1px solid var(--rule);border-radius:2px;font-size:.85em;color:var(--text-lo)}
  .mode.live{color:var(--amber);border-color:var(--amber-dim)}
  main{flex:1;position:relative;min-height:0}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas#cv.dragging{cursor:grabbing}
  .ekgwrap{padding:0 clamp(16px,4vw,32px)}
  .ekglabel{font-size:clamp(8px,1.1vh,10px);letter-spacing:.24em;color:var(--text-lo);text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between}
  .ekglabel .bpm{color:var(--amber);font-variant-numeric:tabular-nums}
  canvas#ekg{width:100%;height:clamp(42px,6.5vh,64px);display:block;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .stats{
    padding:clamp(8px,1.4vh,14px) clamp(16px,4vw,32px);
    display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px;
  }
  .cell .k{font-size:clamp(8px,1.05vh,10px);letter-spacing:.2em;color:var(--text-lo);text-transform:uppercase;margin-bottom:2px}
  .cell .v{font-size:clamp(12px,1.7vh,16px);color:var(--text-hi);font-weight:600;font-variant-numeric:tabular-nums}
  .cell .v.wd{color:var(--wd-red)}
  .cell .v.au{color:var(--amber)}
  .ticker{
    padding:0 clamp(16px,4vw,32px) clamp(12px,2.2vh,22px);
    display:flex;flex-direction:column;gap:3px;
    font-size:clamp(9px,1.35vh,13px);
    font-variant-numeric:tabular-nums;
  }
  .row{display:flex;gap:8px;white-space:nowrap;overflow:hidden;color:var(--text-mid)}
  .row .t{color:var(--text-lo);flex:0 0 auto}
  .row .op{flex:0 0 auto;font-weight:700}
  .row .op.an{color:var(--amber)}
  .row .op.wd{color:var(--wd-red)}
  .row .pfx{color:var(--text-hi)}
  .row .asn{color:var(--text-mid);overflow:hidden;text-overflow:ellipsis}
  .row .via{color:var(--text-lo);margin-left:auto;flex:0 0 auto}
  .row.au{background:linear-gradient(90deg,rgba(255,160,46,.12),transparent 70%);border-left:2px solid var(--amber);padding-left:6px}
  .row:nth-child(n+5){opacity:.55}
  .row:nth-child(n+7){opacity:.32}
  @media (prefers-reduced-motion: reduce){ .beacon{animation:none} }
</style>
</head>

  for(const k in RRC){
    const r=RRC[k];
    const p=project(r[3],r[4],r[5],1.004,sT,cT,sR,cR);
    if(p[2]<=0.02) continue;
    ctx.fillStyle='rgba(255,190,110,.9)';
    ctx.fillRect(p[0]-1.5,p[1]-1.5,3,3);
    ctx.strokeStyle='rgba(255,160,46,.35)';
    ctx.beginPath(); ctx.arc(p[0],p[1],4.5,0,7); ctx.stroke();
  }

  // pulses
  for(let i=pulses.length-1;i>=0;i--){
    const pu=pulses[i]; pu.age+=dt;
    if(pu.age>1.6){ pulses.splice(i,1); continue; }
    const p=project(pu.vx,pu.vy,pu.vz,1.004,sT,cT,sR,cR);
    if(p[2]<=0.02) continue;
    const a=1-pu.age/1.6;
    const rad=4+pu.age*(pu.kind===2?34:22);
    ctx.strokeStyle = pu.kind===1? 'rgba(255,75,62,'+(a*0.8).toFixed(2)+')'
                   : pu.kind===2? 'rgba(255,200,120,'+(a*0.95).toFixed(2)+')'
                   : 'rgba(255,160,46,'+(a*0.7).toFixed(2)+')';
    ctx.lineWidth = pu.kind===2? 1.8:1.2;
    ctx.beginPath(); ctx.arc(p[0],p[1],rad,0,7); ctx.stroke();
    if(pu.kind===2 && pu.age<0.5){
      ctx.fillStyle='rgba(255,220,160,'+((1-pu.age*2)*0.9).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(p[0],p[1],3,0,7); ctx.fill();
    }
  }

  drawEKG();
  if((nowP|0)%500<17) hud();
  requestAnimationFrame(frame);
}

function drawEKG(){
  const w=ek.getBoundingClientRect().width, h=ek.getBoundingClientRect().height;
  ectx.clearRect(0,0,w,h);
  let mx=4; for(let i=0;i<240;i++) if(rate[i]>mx) mx=rate[i];
  ectx.strokeStyle='rgba(255,160,46,.9)';
  ectx.lineWidth=1.4;
  ectx.beginPath();
  for(let i=0;i<240;i++){
    const idx=(rateIdx+i)%240;
    const x=i/239*w;
    const y=h-3-(rate[idx]/mx)*(h-8);
    if(i===0) ectx.moveTo(x,y); else ectx.lineTo(x,y);
  }
  ectx.stroke();
  // glow under the most recent samples
  const gg=ectx.createLinearGradient(w*0.7,0,w,0);
  gg.addColorStop(0,'rgba(255,160,46,0)');
  gg.addColorStop(1,'rgba(255,160,46,.14)');
  ectx.fillStyle=gg; ectx.fillRect(w*0.7,0,w*0.3,h);
}

function fmt(n){ return n>=1e6? (n/1e6).toFixed(1)+'M' : n>=1e4? (n/1e3).toFixed(0)+'K' : n.toLocaleString(); }
function hud(){
  $('utc').textContent=new Date().toISOString().slice(0,19).replace('T',' ')+' UTC';
  let sum=0; for(let i=0;i<240;i++) sum+=rate[i];
  $('rate').textContent=fmt(Math.round(sum));
  let recent=0; for(let i=1;i<=8;i++) recent+=rate[(rateIdx-i+240)%240];
  $('bps').textContent=(recent/2).toFixed(0)+' /s';
  $('san').textContent=fmt(totAn);
  $('swd').textContent=fmt(totWd);
  $('sau').textContent=fmt(totAu);
  const up=(Date.now()-startT)/60000;
  $('sup').textContent= up<90? up.toFixed(0)+'m' : up<2880? (up/60).toFixed(1)+'h' : (up/1440).toFixed(1)+'d';
}

resize();
connect();
setTimeout(()=>{ if(!live) simUntilLive(); }, 6000);
requestAnimationFrame(frame);
})();
</script>
