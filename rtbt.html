<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castle Defence — Version Board</title>
<!--
  CASTLE DEFENCE VERSION BOARD — SPARK Centre, Boneo PS
  Mirrors the RedTeam/BlueTeam Google Sheet.

  SHEET LAYOUT (one tab, two blocks side by side):
    Blue Team | Beta Test | V1.0 | V1.2 | ... | V1.6 |   | Red Team | Beta Test | ...
  Milestone cells: Yes / Y / X / 1 / true / tick = done (green). Blank = not yet (yellow).
  FINAL column (the treasure raid): Yes = treasure found (glowing chest),
  No / Fail = raid failed (empty open chest), blank = not attempted (closed chest).

  The list is ranked with the furthest-ahead classes first and auto-scrolls
  in a continuous loop when it doesn't all fit on screen. Hover pauses it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121018;
    --panel: #1d1927;
    --panel-2: #241e31;
    --line: #37304b;
    --text: #efeaf7;
    --muted: #9a92b4;
    --red: #e5484d;
    --blue: #4a9eea;
    --gold: #f5b83d;
    --todo: #e8b73a;       /* yellow: not done yet */
    --todo-edge: #9c7a1c;
    --done: #3fcf7a;       /* green: moving forward */
    --done-edge: #2a9c58;
    --bright: #6dff8e;     /* glowing treasure green */
    --cell: clamp(18px, 2.2vw, 48px);
    --rowh: clamp(46px, 7.5vh, 110px);
    --rowgap: clamp(4px, .6vh, 10px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    padding: clamp(12px, 1.5vw, 28px);
    gap: clamp(10px, 1.2vh, 18px);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-family: "Silkscreen", monospace;
    font-weight: 700;
    font-size: clamp(20px, 2.6vw, 44px);
    letter-spacing: 1px;
  }
  header h1 .r { color: var(--red); }
  header h1 .b { color: var(--blue); }
  .sync { color: var(--muted); font-size: clamp(12px, 1vw, 18px); }
  .sync .dot {
    display: inline-block; width: .6em; height: .6em; border-radius: 50%;
    background: var(--done); margin-right: .4em;
  }
  .sync.stale .dot { background: var(--gold); }

  /* ---------- milestone rail ---------- */
  .rail {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: clamp(10px, 1.3vh, 20px) clamp(12px, 1.4vw, 26px);
  }
  .rail-track { display: grid; position: relative; }
  .rail-track::before {
    content: "";
    position: absolute;
    left: 7%;
    right: 7%;
    top: calc(clamp(14px, 1.6vh, 22px) * 0.85);
    border-top: 3px dashed var(--line);
  }
  .commit {
    position: relative;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    opacity: .6;
  }
  .commit .node {
    width: clamp(14px, 1.6vh, 22px);
    height: clamp(14px, 1.6vh, 22px);
    border: 3px solid var(--todo);
    background: var(--bg);
    transform: rotate(45deg);
    z-index: 1;
  }
  .commit .tag {
    font-family: "Silkscreen", monospace;
    font-size: clamp(11px, 1.05vw, 20px);
    color: var(--muted);
  }
  .commit .count { font-size: clamp(10px, .9vw, 16px); color: var(--muted); }
  .commit.done { opacity: .95; }
  .commit.done .node { background: var(--done); border-color: var(--done); }
  .commit.done .count { color: var(--done); }
  .commit.now { opacity: 1; }
  .commit.now .node {
    border-color: var(--gold);
    background: var(--gold);
    box-shadow: 0 0 0 4px rgba(245, 184, 61, .18);
  }
  .commit.now .tag, .commit.now .count { color: var(--gold); }

  /* ---------- class list ---------- */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .row {
    height: var(--rowh);
    flex: none;
    display: grid;
    grid-template-columns: 2.4ch 8ch auto auto 5ch;
    justify-content: center;
    align-items: center;
    column-gap: clamp(8px, .9vw, 18px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: clamp(3px, .4vh, 8px) clamp(10px, 1.1vw, 20px);
  }
  .row.head {
    height: auto;
    background: none;
    border: none;
    padding-top: 0;
    padding-bottom: clamp(3px, .5vh, 8px);
    color: var(--muted);
    font-size: clamp(10px, .85vw, 16px);
  }
  #scroller {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
  }
  #scrolllist {
    display: flex;
    flex-direction: column;
    gap: var(--rowgap);
    will-change: transform;
  }
  #scrolllist.anim { animation: scrollup var(--dur, 45s) linear infinite; }
  #scroller:hover #scrolllist.anim { animation-play-state: paused; }
  @keyframes scrollup {
    from { transform: translateY(0); }
    to   { transform: translateY(calc(-1 * var(--loop, 0px))); }
  }
  @media (prefers-reduced-motion: reduce) {
    #scrolllist.anim { animation: none; }
    #scroller { overflow-y: auto; }
  }
  .rank {
    font-family: "Silkscreen", monospace;
    font-size: clamp(13px, 1.4vw, 28px);
    color: var(--muted);
    text-align: right;
  }
  .rank.r1 { color: var(--gold); }
  .name {
    font-weight: 700;
    font-size: clamp(14px, 1.5vw, 30px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .strip { display: flex; gap: clamp(3px, .35vw, 7px); align-items: center; }
  .cellbox {
    width: var(--cell);
    height: calc(var(--cell) * .62);
    border-radius: 4px;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cellbox.todo { background: var(--todo); border-color: var(--todo-edge); }
  .cellbox.done { background: var(--done); border-color: var(--done-edge); }

  /* ---------- treasure chest (final milestone) ---------- */
  .cellbox.chest { background: none; border: none; }
  .cellbox.chest svg { width: 100%; height: 130%; overflow: visible; }
  .chest .lid    { fill: #a06a33; stroke: #5c3a16; }
  .chest .body   { fill: #84552a; stroke: #5c3a16; }
  .chest .latch  { fill: #d9c15a; stroke: #5c3a16; }
  .chest .inside { fill: #1a1422; }
  .chest.pending .lid { fill: var(--todo); stroke: var(--todo-edge); }
  .chest.pending .body { fill: #b98f2c; stroke: var(--todo-edge); }
  .chest.found .inside { fill: var(--bright); }
  .chest.found .gem { fill: #eafff0; }
  .chest.found svg {
    filter: drop-shadow(0 0 6px rgba(109, 255, 142, .95));
    animation: tglow 1.4s ease-in-out infinite;
  }
  @keyframes tglow {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(109, 255, 142, .8)); }
    50%      { filter: drop-shadow(0 0 13px rgba(109, 255, 142, 1)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chest.found svg { animation: none; }
  }
  .chest.empty .inside { fill: #15101c; }
  .chest.empty .lid, .chest.empty .body { fill: #4a3c2a; stroke: #2e2418; }
  .chest.empty .latch { fill: #6b5c3a; }

  .lab {
    width: var(--cell);
    text-align: center;
    font-family: "Silkscreen", monospace;
    font-size: clamp(8px, .72vw, 14px);
    overflow: hidden;
  }
  .striplab { display: flex; gap: clamp(3px, .35vw, 7px); }
  .head .teamword.blue { color: var(--blue); }
  .head .teamword.red { color: var(--red); }
  .total {
    font-family: "Silkscreen", monospace;
    font-size: clamp(14px, 1.5vw, 30px);
    text-align: right;
  }
  .total small { color: var(--muted); font-size: .55em; }

  .banner {
    text-align: center;
    color: var(--gold);
    font-size: clamp(12px, 1vw, 18px);
    padding: 6px;
    border: 1px dashed var(--gold);
    border-radius: 8px;
    display: none;
  }
  .banner.show { display: block; }
  .banner.error { color: var(--red); border-color: var(--red); }
</style>
</head>
<body>

<header>
  <h1><span class="r">Red</span> vs <span class="b">Blue</span> — Version Board</h1>
  <div class="sync" id="sync"><span class="dot"></span><span id="syncText">connecting…</span></div>
</header>

<div class="rail"><div class="rail-track" id="rail"></div></div>

<main>
  <div id="gridhead"></div>
  <div id="scroller"><div id="scrolllist"></div></div>
</main>

<div class="banner" id="banner"></div>

<script>
var CONFIG = {
  sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQuZjLN8FALS27_BdYEwaYcbs1T26JJ8VAXSRJr9u0tMwjbDlAy2pQ-Hpd7-QvsbLhnBEChiEtK2DgH/pub?output=csv",
  refreshSeconds: 60,
  secondsPerRow: 2.8   /* scroll pace: lower = faster */
};

var DONE = { "yes": 1, "y": 1, "x": 1, "1": 1, "true": 1, "done": 1, "found": 1, "\u2713": 1, "\u2714": 1 };
var FAIL = { "no": 1, "n": 1, "0": 1, "false": 1, "fail": 1, "failed": 1, "empty": 1, "missed": 1 };
function isDone(v) { return !!DONE[String(v || "").trim().toLowerCase()]; }
function isFail(v) { return !!FAIL[String(v || "").trim().toLowerCase()]; }

function parseCSV(text) {
  var rows = [], row = [], cell = "", q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') { q = false; }
      else { cell += c; }
    } else if (c === '"') { q = true; }
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      rows.push(row); row = [];
    } else { cell += c; }
  }
  row.push(cell); rows.push(row);
  return rows.filter(function (r) {
    return r.some(function (v) { return String(v).trim() !== ""; });
  });
}

/* Find the Blue Team and Red Team blocks wherever they sit in the header row.
   Cell values are kept raw so the final column can distinguish Yes / No / blank. */
function parseSheet(rows) {
  var head = rows[0].map(function (h) { return String(h).trim(); });
  var lower = head.map(function (h) { return h.toLowerCase(); });
  var bi = lower.indexOf("blue team");
  var ri = lower.indexOf("red team");
  if (bi < 0 || ri < 0) throw new Error("couldn't find Blue Team / Red Team headers");

  function milestones(start, stop) {
    var out = [];
    for (var i = start + 1; i < stop; i++) {
      if (head[i] === "") break;
      out.push({ col: i, label: head[i] });
    }
    return out;
  }
  var first = Math.min(bi, ri), second = Math.max(bi, ri);
  var mFirst = milestones(first, second);
  var mSecond = milestones(second, head.length);
  var blueM = bi < ri ? mFirst : mSecond;
  var redM = bi < ri ? mSecond : mFirst;

  var classes = [];
  rows.slice(1).forEach(function (r) {
    var name = String(r[bi] || r[ri] || "").trim();
    if (!name) return;
    classes.push({
      name: name,
      blue: blueM.map(function (m) { return String(r[m.col] || "").trim(); }),
      red: redM.map(function (m) { return String(r[m.col] || "").trim(); })
    });
  });
  return { milestones: blueM.map(function (m) { return m.label; }), classes: classes };
}

var DEMO_CLASSES = ["Prep A","Prep B","1 A","1 B","2 A","2 B","3 A","3 B","3 C","4 A","4 B","4 C","5 A","5 B","6 A","6 B"];
function demoData() {
  var ms = ["Beta Test","V1.0","V1.2","V1.3","V1.4","V1.5","V1.6"];
  var classes = DEMO_CLASSES.map(function (n, i) {
    var prog = 1 + (i * 5) % 3;
    return {
      name: n,
      blue: ms.map(function (_, j) { return j < prog ? "Yes" : ""; }),
      red: ms.map(function (_, j) { return j < prog - (i % 2) ? "Yes" : ""; })
    };
  });
  classes[12].blue[6] = "Yes";  /* 5 A blue cracked the treasure */
  classes[5].red[6] = "No";     /* 2 B red raid failed */
  return { milestones: ms, classes: classes };
}

function shortLabel(s) {
  return String(s).replace(/^beta.*$/i, "Beta").replace(/^v/i, "");
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function chestSVG(state) {
  /* state: pending (closed), found (open + glowing loot), empty (open, nothing) */
  var open = state !== "pending";
  var lid = open
    ? '<rect class="lid" x="1" y="0" width="14" height="3" rx="1"></rect>'
    : '<rect class="lid" x="1" y="3" width="14" height="4" rx="1"></rect>';
  var inside = open
    ? '<rect class="inside" x="3" y="6" width="10" height="3"></rect>'
    : "";
  var gems = state === "found"
    ? '<rect class="gem" x="5" y="6.6" width="1.6" height="1.6"></rect>' +
      '<rect class="gem" x="9.4" y="6.6" width="1.6" height="1.6"></rect>'
    : "";
  var latch = open ? "" : '<rect class="latch" x="7" y="6" width="2" height="3"></rect>';
  return '<svg viewBox="0 0 16 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect class="body" x="1" y="' + (open ? 5 : 6) + '" width="14" height="' + (open ? 8 : 7) + '" rx="1"></rect>' +
    inside + gems + lid + latch + "</svg>";
}

function cellHTML(raw, isLast) {
  if (isLast) {
    var state = isDone(raw) ? "found" : isFail(raw) ? "empty" : "pending";
    return '<div class="cellbox chest ' + state + '" title="Treasure raid">' + chestSVG(state) + "</div>";
  }
  return '<div class="cellbox ' + (isDone(raw) ? "done" : "todo") + '"></div>';
}

function renderRail(data) {
  var teams = data.classes.length * 2;
  var track = document.getElementById("rail");
  track.style.gridTemplateColumns = "repeat(" + data.milestones.length + ", 1fr)";
  var currentFound = false;
  track.innerHTML = data.milestones.map(function (m, j) {
    var ticks = 0;
    data.classes.forEach(function (c) {
      ticks += (isDone(c.blue[j]) ? 1 : 0) + (isDone(c.red[j]) ? 1 : 0);
    });
    var cls = "";
    if (ticks >= teams && teams > 0) cls = "done";
    else if (!currentFound) { cls = "now"; currentFound = true; }
    return '<div class="commit ' + cls + '">' +
      '<div class="node"></div>' +
      '<div class="tag">' + esc(shortLabel(m)) + "</div>" +
      '<div class="count">' + ticks + "/" + teams + "</div>" +
      "</div>";
  }).join("");
}

function renderGrid(data) {
  var n = data.milestones.length;
  function labels() {
    return '<div class="striplab">' + data.milestones.map(function (m) {
      return '<div class="lab">' + esc(shortLabel(m)) + "</div>";
    }).join("") + "</div>";
  }
  document.getElementById("gridhead").innerHTML = '<div class="row head">' +
    '<div></div><div>Class</div>' +
    '<div><span class="teamword blue">Blue</span>' + labels() + "</div>" +
    '<div><span class="teamword red">Red</span>' + labels() + "</div>" +
    '<div style="text-align:right">of ' + (n * 2) + "</div>" +
    "</div>";

  /* rank by total milestones: furthest ahead scrolls past first */
  var order = data.classes.map(function (c) {
    var t = 0;
    c.blue.forEach(function (v) { if (isDone(v)) t++; });
    c.red.forEach(function (v) { if (isDone(v)) t++; });
    return { c: c, total: t };
  }).sort(function (a, b) { return b.total - a.total; });

  var rowsHTML = order.map(function (e, i) {
    function strip(team, cells) {
      return '<div class="strip ' + team + '">' + cells.map(function (raw, j) {
        return cellHTML(raw, j === n - 1);
      }).join("") + "</div>";
    }
    return '<div class="row">' +
      '<div class="rank' + (i === 0 ? " r1" : "") + '">' + (i + 1) + "</div>" +
      '<div class="name">' + esc(e.c.name) + "</div>" +
      strip("blue", e.c.blue) +
      strip("red", e.c.red) +
      '<div class="total">' + e.total + "<small>/" + (n * 2) + "</small></div>" +
      "</div>";
  }).join("");

  var list = document.getElementById("scrolllist");
  var scroller = document.getElementById("scroller");
  list.classList.remove("anim");
  list.style.transform = "";
  list.innerHTML = rowsHTML;

  /* animate only when the list overflows the screen */
  requestAnimationFrame(function () {
    var oneCopy = list.scrollHeight;
    if (oneCopy > scroller.clientHeight + 2) {
      var gap = parseFloat(getComputedStyle(list).rowGap) || 0;
      list.innerHTML = rowsHTML + rowsHTML;       /* second copy for a seamless loop */
      list.style.setProperty("--loop", (oneCopy + gap) + "px");
      list.style.setProperty("--dur", (order.length * CONFIG.secondsPerRow) + "s");
      list.classList.add("anim");
    }
  });
}

function setSync(text, stale) {
  document.getElementById("sync").classList.toggle("stale", !!stale);
  document.getElementById("syncText").textContent = text;
}
function banner(msg, isError) {
  var el = document.getElementById("banner");
  el.textContent = msg || "";
  el.classList.toggle("show", !!msg);
  el.classList.toggle("error", !!isError);
}

async function refresh() {
  if (!CONFIG.sheetCsvUrl) {
    var d = demoData();
    renderRail(d); renderGrid(d);
    setSync("demo mode", true);
    return;
  }
  try {
    var res = await fetch(CONFIG.sheetCsvUrl, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    var data = parseSheet(parseCSV(await res.text()));
    if (!data.classes.length) throw new Error("no class rows found");
    renderRail(data); renderGrid(data);
    setSync("synced " + new Date().toLocaleTimeString("en-AU",
      { hour: "2-digit", minute: "2-digit" }));
    banner("");
  } catch (e) {
    var d2 = demoData();
    renderRail(d2); renderGrid(d2);
    setSync("sync failed — demo data", true);
    banner("Could not read the sheet (" + e.message + "). Showing demo data.", true);
  }
}

refresh();
setInterval(refresh, CONFIG.refreshSeconds * 1000);
</script>
</body>
</html>
