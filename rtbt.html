<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castle Defence — Version Board</title>
<!--
  CASTLE DEFENCE VERSION BOARD — SPARK Centre, Boneo PS
  Mirrors the RedTeam/BlueTeam Google Sheet.

  SHEET LAYOUT (one tab, two blocks side by side):
    Blue Team | Beta Test | V1.0 | V1.2 | ... | V1.6 |   | Red Team | Beta Test | ...
  Milestone cells: Yes / Y / X / 1 / true / tick = done (green). Blank = not yet (yellow).
  FINAL column (the treasure raid): Yes = treasure found (glowing chest),
  No / Fail = raid failed (empty open chest), blank = not attempted (closed chest).

  The list is ranked with the furthest-ahead classes first and auto-scrolls
  in a continuous loop when it doesn't all fit on screen. Hover pauses it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121018;
    --panel: #1d1927;
    --panel-2: #241e31;
    --line: #37304b;
    --text: #efeaf7;
    --muted: #9a92b4;
    --red: #e5484d;
    --blue: #4a9eea;
    --gold: #f5b83d;
    --todo: #e8b73a;       /* yellow: not done yet */
    --todo-edge: #9c7a1c;
    --done: #3fcf7a;       /* green: moving forward */
    --done-edge: #2a9c58;
    --bright: #6dff8e;     /* glowing treasure green */
    --cell: clamp(30px, 3.1vw, 66px);
    --rowh: clamp(46px, 7.5vh, 110px);
    --rowgap: clamp(4px, .6vh, 10px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    padding: clamp(12px, 1.5vw, 28px);
    gap: clamp(10px, 1.2vh, 18px);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-family: "Silkscreen", monospace;
    font-weight: 700;
    font-size: clamp(20px, 2.6vw, 44px);
    letter-spacing: 1px;
  }
  header h1 .r { color: var(--red); }
  header h1 .b { color: var(--blue); }
  .sync { color: var(--muted); font-size: clamp(12px, 1vw, 18px); }
  .sync .dot {
    display: inline-block; width: .6em; height: .6em; border-radius: 50%;
    background: var(--done); margin-right: .4em;
  }
  .sync.stale .dot { background: var(--gold); }

  /* ---------- milestone rail ---------- */
  .rail {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: clamp(10px, 1.3vh, 20px) clamp(12px, 1.4vw, 26px);
  }
  .rail-track { display: grid; position: relative; }
  .rail-track::before {
    content: "";
    position: absolute;
    left: 7%;
    right: 7%;
    top: calc(clamp(14px, 1.6vh, 22px) * 0.85);
    border-top: 3px dashed var(--line);
  }
  .commit {
    position: relative;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    opacity: .6;
  }
  .commit .node {
    width: clamp(14px, 1.6vh, 22px);
    height: clamp(14px, 1.6vh, 22px);
    border: 3px solid var(--todo);
    background: var(--bg);
    transform: rotate(45deg);
    z-index: 1;
  }
  .commit .tag {
    font-family: "Silkscreen", monospace;
    font-size: clamp(11px, 1.05vw, 20px);
    color: var(--muted);
  }
  .commit .count { font-size: clamp(10px, .9vw, 16px); color: var(--muted); }
  .commit.done { opacity: .95; }
  .commit.done .node { background: var(--done); border-color: var(--done); }
  .commit.done .count { color: var(--done); }
  .commit.now { opacity: 1; }
  .commit.now .node {
    border-color: var(--gold);
    background: var(--gold);
    box-shadow: 0 0 0 4px rgba(245, 184, 61, .18);
  }
  .commit.now .tag, .commit.now .count { color: var(--gold); }

  /* ---------- class list ---------- */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .row {
    height: var(--rowh);
    flex: none;
    display: grid;
    grid-template-columns: 2.4ch 8ch auto auto;
    justify-content: center;
    align-items: center;
    column-gap: clamp(8px, .9vw, 18px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: clamp(3px, .4vh, 8px) clamp(10px, 1.1vw, 20px);
  }
  .row.head {
    height: auto;
    background: none;
    border: none;
    padding-top: 0;
    padding-bottom: clamp(3px, .5vh, 8px);
    color: var(--muted);
    font-size: clamp(10px, .85vw, 16px);
  }
  #scroller {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
  }
  #scrolllist {
    display: flex;
    flex-direction: column;
    gap: var(--rowgap);
    will-change: transform;
  }
  #scrolllist.anim { animation: scrollup var(--dur, 45s) linear infinite; }
  #scroller:hover #scrolllist.anim { animation-play-state: paused; }
  @keyframes scrollup {
    from { transform: translateY(0); }
    to   { transform: translateY(calc(-1 * var(--loop, 0px))); }
  }
  @media (prefers-reduced-motion: reduce) {
    #scrolllist.anim { animation: none; }
    #scroller { overflow-y: auto; }
  }
  .rank {
    font-family: "Silkscreen", monospace;
    font-size: clamp(13px, 1.4vw, 28px);
    color: var(--muted);
    text-align: right;
  }
  .rank.r1 { color: var(--gold); }
  .name {
    font-weight: 700;
    font-size: clamp(14px, 1.5vw, 30px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .strip { display: flex; gap: clamp(3px, .35vw, 7px); align-items: center; }
  .cellbox {
    width: var(--cell);
    height: calc(var(--cell) * .62);
    border-radius: 4px;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Silkscreen", monospace;
    font-size: calc(var(--cell) * .24);
    color: #1a1422;
    white-space: nowrap;
    overflow: hidden;
  }
  .cellbox.todo { background: var(--todo); border-color: var(--todo-edge); opacity: .55; }
  .cellbox.done { background: var(--done); border-color: var(--done-edge); font-weight: 700; }

  /* ---------- treasure chest (final milestone) ---------- */
  .cellbox.chest { background: none; border: none; }
  .cellbox.chest svg { width: 100%; height: 130%; overflow: visible; }
  .chest .lid    { fill: #a06a33; stroke: #5c3a16; }
  .chest .body   { fill: #84552a; stroke: #5c3a16; }
  .chest .latch  { fill: #d9c15a; stroke: #5c3a16; }
  .chest .inside { fill: #1a1422; }
  .chest.pending .lid { fill: var(--todo); stroke: var(--todo-edge); }
  .chest.pending .body { fill: #b98f2c; stroke: var(--todo-edge); }
  .chest.found .inside { fill: var(--bright); }
  .chest.found .gem { fill: #eafff0; }
  .chest.found svg {
    filter: drop-shadow(0 0 6px rgba(109, 255, 142, .95));
    animation: tglow 1.4s ease-in-out infinite;
  }
  @keyframes tglow {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(109, 255, 142, .8)); }
    50%      { filter: drop-shadow(0 0 13px rgba(109, 255, 142, 1)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chest.found svg { animation: none; }
  }
  .chest.empty .inside { fill: #15101c; }
  .chest.empty .lid, .chest.empty .body { fill: #4a3c2a; stroke: #2e2418; }
  .chest.empty .latch { fill: #6b5c3a; }

  .lab {
    width: var(--cell);
    text-align: center;
    font-family: "Silkscreen", monospace;
    font-size: clamp(10px, .95vw, 18px);
    color: var(--text);
    white-space: nowrap;
  }
  .striplab { display: flex; gap: clamp(3px, .35vw, 7px); margin-top: 2px; }
  .head .teamword {
    display: block;
    font-family: "Silkscreen", monospace;
    font-size: clamp(12px, 1.1vw, 22px);
    padding-bottom: 3px;
    border-bottom: 3px solid currentColor;
  }
  .head .teamword.blue { color: var(--blue); }
  .head .teamword.red { color: var(--red); }

  .legend {
    display: flex;
    gap: clamp(10px, 1.2vw, 24px);
    color: var(--muted);
    font-size: clamp(12px, 1vw, 18px);
  }
  .legend span { display: inline-flex; align-items: center; gap: .4em; }
  .legend .key { width: 1.4em; height: .9em; border-radius: 3px; }
  .legend .key.done { background: var(--done); }
  .legend .key.todo { background: var(--todo); opacity: .55; }
  .teamgroup {
    display: flex;
    align-items: center;
    gap: clamp(6px, .6vw, 14px);
  }
  .teamtotal {
    font-family: "Silkscreen", monospace;
    font-size: clamp(13px, 1.3vw, 26px);
    min-width: 4.2ch;
  }
  .teamtotal.blue { color: var(--blue); }
  .teamtotal.red { color: var(--red); }
  .teamtotal small { color: var(--muted); font-size: .6em; }
  .teamtotal.hid { visibility: hidden; }

  /* ---------- treasure versions ---------- */
  .rail { display: flex; align-items: center; gap: clamp(12px, 1.6vw, 32px); }
  .rail-track { flex: 1; }
  .quest {
    display: flex;
    align-items: center;
    gap: clamp(8px, .8vw, 16px);
    padding: clamp(6px, .8vh, 14px) clamp(10px, 1vw, 20px);
    border: 2px solid var(--gold);
    border-radius: 10px;
    background: rgba(245, 184, 61, .08);
    flex: none;
  }
  .qchest { width: clamp(32px, 3vw, 64px); }
  .qchest svg { width: 100%; height: auto; display: block; overflow: visible; }
  .qtop {
    font-family: "Silkscreen", monospace;
    color: var(--gold);
    font-size: clamp(11px, .95vw, 18px);
  }
  .qloot { font-weight: 700; font-size: clamp(15px, 1.6vw, 32px); color: var(--bright); }
  .qsub { color: var(--muted); font-size: clamp(10px, .8vw, 15px); }
  .qnote {
    color: var(--gold);
    font-size: clamp(10px, .85vw, 16px);
    font-family: "Silkscreen", monospace;
    margin-top: 2px;
  }

  .mini { display: inline-block; width: 1.1em; height: .95em; vertical-align: -.1em; margin-right: .25em; }
  .mini svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .lab .mini { display: block; margin: 0 auto 2px; height: 1em; }
  .lab.tr { color: var(--gold); }
  .lab.wk {
    background: var(--gold);
    color: #1a1422;
    border-radius: 4px 4px 0 0;
  }
  .commit.tr .tag { color: var(--gold); }
  .wkflag {
    font-family: "Silkscreen", monospace;
    font-size: clamp(9px, .75vw, 14px);
    background: var(--gold);
    color: #1a1422;
    padding: 1px 6px;
    border-radius: 4px;
  }

  /* treasure columns: small gold gem in the corner; this week: gold frame */
  .cellbox.tr:not(.chest) { position: relative; }
  .cellbox.tr:not(.chest)::after {
    content: "";
    position: absolute;
    top: 2px; right: 2px;
    width: calc(var(--cell) * .13);
    height: calc(var(--cell) * .13);
    background: var(--gold);
    border: 1px solid #5c3a16;
    transform: rotate(45deg);
  }
  .cellbox.wk:not(.chest) { outline: 3px solid var(--gold); outline-offset: 1px; opacity: 1; }
  .cellbox.wk.todo { animation: wkpulse 1.6s ease-in-out infinite; }
  @keyframes wkpulse {
    0%, 100% { outline-color: var(--gold); }
    50%      { outline-color: rgba(245, 184, 61, .3); }
  }
  @media (prefers-reduced-motion: reduce) { .cellbox.wk.todo { animation: none; } }
  .legend .key.tr { background: none; width: .8em; height: .8em; border: 1px solid #5c3a16; background-color: var(--gold); transform: rotate(45deg); }

  /* ---------- treasure hoard strip (across the top) ---------- */
  .hoard-wrap { display: flex; flex-direction: column; gap: clamp(4px, .6vh, 10px); }
  .hoard-title {
    font-family: "Silkscreen", monospace;
    color: var(--gold);
    font-size: clamp(13px, 1.25vw, 24px);
    letter-spacing: .5px;
  }
  .hoard-title small { color: var(--muted); font-family: "Atkinson Hyperlegible", sans-serif; font-size: .75em; letter-spacing: 0; margin-left: .5em; }
  .hoard {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.3fr);
    gap: clamp(6px, .8vw, 16px);
  }
  /* two-row layout: treasures on top, then this-week + next-week */
  .hoard.tworow { display: flex; flex-direction: column; }
  .hrow { display: grid; gap: clamp(6px, .8vw, 16px); }
  .hrow.treasures { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .hrow.finals { grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); }
  .tcard.adventure { align-items: center; }
  .tcard.adventure .advicon { font-size: clamp(26px, 2.6vw, 48px); line-height: 1; flex: none; }
  .tcard {
    position: relative;
    display: flex;
    align-items: center;
    gap: clamp(8px, .8vw, 16px);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: clamp(8px, 1vh, 16px) clamp(10px, 1vw, 18px);
    min-width: 0;
  }
  .tcard .tchest { width: clamp(30px, 2.8vw, 58px); flex: none; }
  .tcard .tchest svg { width: 100%; height: auto; display: block; overflow: visible; }
  .tcard .tver {
    font-family: "Silkscreen", monospace;
    font-size: clamp(10px, .85vw, 16px);
    color: var(--muted);
  }
  .tcard .tname {
    font-weight: 700;
    font-size: clamp(16px, 1.7vw, 34px);
    line-height: 1.05;
    color: var(--text);
  }
  .tcard .tplain {
    color: var(--muted);
    font-size: clamp(11px, .9vw, 17px);
    line-height: 1.2;
    margin-top: 2px;
  }
  .tcard .tstat {
    display: inline-block;
    margin-top: 4px;
    font-family: "Silkscreen", monospace;
    font-size: clamp(9px, .75vw, 14px);
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--done);
    color: #10251a;
  }
  .tcard.past { border-color: var(--done-edge); }
  .tcard.last {
    border-color: var(--gold);
    background: rgba(245, 184, 61, .1);
    animation: lastpulse 1.8s ease-in-out infinite;
  }
  .tcard.last .tname { color: var(--gold); }
  .tcard.last .tstat { background: var(--gold); color: #1a1422; }
  @keyframes lastpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 184, 61, .0); }
    50%      { box-shadow: 0 0 0 5px rgba(245, 184, 61, .3); }
  }
  .tcard.next {
    border: 2px solid transparent;
    background:
      linear-gradient(var(--panel-2), var(--panel-2)) padding-box,
      linear-gradient(90deg, var(--red), var(--blue)) border-box;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
  }
  .tcard.next .tver { color: var(--text); }
  .tcard.next .tname {
    font-family: "Silkscreen", monospace;
    font-size: clamp(15px, 1.55vw, 32px);
    background: linear-gradient(90deg, var(--red), #ff8f8f 45%, var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tcard.next .tplain { color: var(--text); opacity: .85; }
  .tcard.next .tplain b.r { color: var(--red); }
  .tcard.next .tplain b.b { color: var(--blue); }
  @media (prefers-reduced-motion: reduce) { .tcard.last { animation: none; } }

  /* ticks on hidden treasures */
  .tcard .tchest { position: relative; }
  .ttick {
    position: absolute;
    right: -.45em; top: -.55em;
    width: 1.35em; height: 1.35em;
    border-radius: 50%;
    background: var(--done);
    color: #10251a;
    font-weight: 700;
    font-size: clamp(11px, .95vw, 18px);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 2px var(--panel);
  }

  /* ---------- the raid: treasures bursting out of the chest ---------- */
  .hoard.raid { grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 2fr); }
  .tcard.next.live {
    flex-direction: row;
    align-items: center;
    gap: clamp(10px, 1.2vw, 24px);
    overflow: visible;
    z-index: 2;
    animation: raidglow 2.4s ease-in-out infinite;
  }
  @keyframes raidglow {
    0%, 100% { box-shadow: -6px 0 18px -4px rgba(229, 72, 77, .7), 6px 0 18px -10px rgba(74, 158, 234, .2); }
    50%      { box-shadow: -6px 0 18px -10px rgba(229, 72, 77, .2), 6px 0 18px -4px rgba(74, 158, 234, .7); }
  }
  .tcard.next.live .tname { font-size: clamp(17px, 1.9vw, 40px); }
  .stage {
    position: relative;
    flex: none;
    align-self: stretch;
    width: clamp(100px, 9vw, 190px);
    min-height: clamp(56px, 7vh, 110px);
    font-size: clamp(8px, .7vw, 14px);
  }
  .bigchest {
    position: absolute;
    left: 50%; bottom: 0;
    width: 52%;
    transform: translateX(-50%);
    animation: chesthop 1.4s ease-in-out infinite;
    z-index: 1;
  }
  .bigchest svg { width: 100%; height: auto; display: block; overflow: visible; }
  @keyframes chesthop {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(0); }
    20%      { transform: translateX(-50%) translateY(-6%) rotate(-3deg); }
    40%      { transform: translateX(-50%) translateY(0) rotate(2deg); }
  }
  .beam {
    position: absolute;
    left: 50%; bottom: 25%;
    width: 46%; height: 140%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 100%, rgba(109, 255, 142, .55), rgba(245, 184, 61, .18) 45%, transparent 70%);
    filter: blur(2px);
    animation: beam 1.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes beam { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .loot, .spark {
    position: absolute;
    left: 50%; bottom: 30%;
    opacity: 0;
    z-index: 2;
    animation: burst 2.8s cubic-bezier(.2, .9, .3, 1) infinite;
    animation-delay: var(--d);
  }
  .loot {
    font-family: "Silkscreen", monospace;
    font-weight: 700;
    font-size: 1.15em;
    color: #120e18;
    padding: .2em .5em;
    border-radius: .35em;
    border: 2px solid rgba(0, 0, 0, .35);
    white-space: nowrap;
    box-shadow: 0 0 10px rgba(255, 255, 255, .45);
  }
  .spark {
    width: .7em; height: .7em;
    background: #fff6c8;
    box-shadow: 0 0 8px #ffe27a;
    animation-name: sparkle;
  }
  @keyframes burst {
    0%   { transform: translate(-50%, 0) scale(.2) rotate(0); opacity: 0; }
    12%  { opacity: 1; }
    45%  { transform: translate(calc(-50% + var(--dx)), var(--dy)) scale(1.1) rotate(-6deg); opacity: 1; }
    75%  { transform: translate(calc(-50% + var(--dx)), calc(var(--dy) - .6em)) scale(1) rotate(4deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(var(--dy) - 1.2em)) scale(.9); opacity: 0; }
  }
  @keyframes sparkle {
    0%   { transform: translate(-50%, 0) rotate(45deg) scale(0); opacity: 0; }
    30%  { opacity: 1; }
    60%  { transform: translate(calc(-50% + var(--dx)), var(--dy)) rotate(45deg) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), var(--dy)) rotate(45deg) scale(0); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tcard.next.live, .bigchest, .beam { animation: none; }
    .spark { display: none; }
    .loot { animation: none; opacity: 1; transform: translate(calc(-50% + var(--dx)), var(--dy)); }
  }
  @media (max-width: 900px) {
    .hoard.raid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .hoard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tcard.next { grid-column: 1 / -1; }
    .hrow.treasures { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hrow.finals { grid-template-columns: 1fr; }
  }

  .banner {
    text-align: center;
    color: var(--gold);
    font-size: clamp(12px, 1vw, 18px);
    padding: 6px;
    border: 1px dashed var(--gold);
    border-radius: 8px;
    display: none;
  }
  .banner.show { display: block; }
  .banner.error { color: var(--red); border-color: var(--red); }
</style>
</head>
<body>

<header>
  <h1><span class="r">Red</span> vs <span class="b">Blue</span> — Version Board</h1>
  <div class="legend">
    <span><i class="key done"></i>Version done</span>
    <span><i class="key todo"></i>Not yet</span>
    <span><i class="key tr"></i>Has treasure</span>
  </div>
  <div class="sync" id="sync"><span class="dot"></span><span id="syncText">connecting…</span></div>
</header>

<section class="hoard-wrap" aria-label="Treasures to hide">
  <div class="hoard-title"><span id="hoardTitle">Treasures your castle should have hidden by now</span><small id="hoardNote"></small></div>
  <div class="hoard" id="hoard"></div>
</section>

<div class="rail">
  <div class="rail-track" id="rail"></div>
</div>

<main>
  <div id="gridhead"></div>
  <div id="scroller"><div id="scrolllist"></div></div>
</main>

<div class="banner" id="banner"></div>

<script>
var CONFIG = {
  sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQuZjLN8FALS27_BdYEwaYcbs1T26JJ8VAXSRJr9u0tMwjbDlAy2pQ-Hpd7-QvsbLhnBEChiEtK2DgH/pub?output=csv",
  refreshSeconds: 60,
  secondsPerRow: 2.8,  /* scroll pace: lower = faster */

  /* TREASURE: every version from treasureFrom onward has a hidden treasure.
     Update thisWeek + add the treasure each week. */
  treasureFrom: "V1.2",
  thisWeek: "V1.6",
  /* shown across the top, in order. "plain" = kid-friendly meaning. */
  treasures: {
    "V1.2": { name: "IP address",   plain: "Your castle's address on the network" },
    "V1.3": { name: "Port",         plain: "The door number into your castle" },
    "V1.4": { name: "Public key",   plain: "Your castle's ID card. Safe to show." },
    "V1.5": { name: "Seed phrase",  plain: "The secret words that unlock everything" }
  },
  /* this week: not a new treasure — a playtest that you can still reach your own treasures */
  thisWeekCard: {
    ver: "V1.6",
    icon: "🗺️",
    title: "Adventure mode",
    text: "Play through and make sure you can still find all 4 of your <b>own</b> hidden treasures before the swap-over."
  },
  /* next week: the raid — swap over and hack the other team */
  nextWeek: {
    ver: "V1.7",
    title: "The final hack!",
    text: '<b class="r">Red</b> raids <b class="b">Blue</b>. <b class="b">Blue</b> raids <b class="r">Red</b>. Find all 4 of their treasures.'
  },
  sideNote: "DMZ available for testing",

  /* every version BEFORE this one shows green for every class, whatever the sheet says.
     Set to "" to go back to reading the sheet for all columns. */
  forceDoneBefore: "V1.7"
};

function applyOverrides(data) {
  var stop = data.milestones.map(verKey).indexOf(verKey(CONFIG.forceDoneBefore || ""));
  if (stop < 0) return data;
  data.classes.forEach(function (c) {
    for (var j = 0; j < stop; j++) { c.blue[j] = "Yes"; c.red[j] = "Yes"; }
  });
  return data;
}

function verKey(s) { return shortLabel(s).toUpperCase(); }
function treasureInfo(milestones) {
  var keys = milestones.map(verKey);
  return {
    start: keys.indexOf(verKey(CONFIG.treasureFrom || "")),
    week: keys.indexOf(verKey(CONFIG.thisWeek || ""))
  };
}
function isTreasureCol(t, j) { return t.start >= 0 && j >= t.start; }
function treasureFor(label) {
  var k = verKey(label);
  for (var key in CONFIG.treasures) if (verKey(key) === k) return CONFIG.treasures[key];
  return "";
}

var DONE = { "yes": 1, "y": 1, "x": 1, "1": 1, "true": 1, "done": 1, "found": 1, "\u2713": 1, "\u2714": 1 };
var FAIL = { "no": 1, "n": 1, "0": 1, "false": 1, "fail": 1, "failed": 1, "empty": 1, "missed": 1 };
function isDone(v) { return !!DONE[String(v || "").trim().toLowerCase()]; }
function isFail(v) { return !!FAIL[String(v || "").trim().toLowerCase()]; }

function parseCSV(text) {
  var rows = [], row = [], cell = "", q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') { q = false; }
      else { cell += c; }
    } else if (c === '"') { q = true; }
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      rows.push(row); row = [];
    } else { cell += c; }
  }
  row.push(cell); rows.push(row);
  return rows.filter(function (r) {
    return r.some(function (v) { return String(v).trim() !== ""; });
  });
}

/* Find the Blue Team and Red Team blocks wherever they sit in the header row.
   Cell values are kept raw so the final column can distinguish Yes / No / blank. */
function parseSheet(rows) {
  var head = rows[0].map(function (h) { return String(h).trim(); });
  var lower = head.map(function (h) { return h.toLowerCase(); });
  var bi = lower.indexOf("blue team");
  var ri = lower.indexOf("red team");
  if (bi < 0 || ri < 0) throw new Error("couldn't find Blue Team / Red Team headers");

  function milestones(start, stop) {
    var out = [];
    for (var i = start + 1; i < stop; i++) {
      if (head[i] === "") break;
      out.push({ col: i, label: head[i] });
    }
    return out;
  }
  var first = Math.min(bi, ri), second = Math.max(bi, ri);
  var mFirst = milestones(first, second);
  var mSecond = milestones(second, head.length);
  var blueM = bi < ri ? mFirst : mSecond;
  var redM = bi < ri ? mSecond : mFirst;

  var classes = [];
  rows.slice(1).forEach(function (r) {
    var name = String(r[bi] || r[ri] || "").trim();
    if (!name) return;
    classes.push({
      name: name,
      blue: blueM.map(function (m) { return String(r[m.col] || "").trim(); }),
      red: redM.map(function (m) { return String(r[m.col] || "").trim(); })
    });
  });
  return { milestones: blueM.map(function (m) { return m.label; }), classes: classes };
}

var DEMO_CLASSES = ["Prep A","Prep B","1 A","1 B","2 A","2 B","3 A","3 B","3 C","4 A","4 B","4 C","5 A","5 B","6 A","6 B"];
function demoData() {
  var ms = ["Beta Test","V1.0","V1.2","V1.3","V1.4","V1.5","V1.6","V1.7"];
  var classes = DEMO_CLASSES.map(function (n, i) {
    var prog = 1 + (i * 5) % 3;
    return {
      name: n,
      blue: ms.map(function (_, j) { return j < prog ? "Yes" : ""; }),
      red: ms.map(function (_, j) { return j < prog - (i % 2) ? "Yes" : ""; })
    };
  });
  classes[12].blue[6] = "Yes";  /* 5 A blue cracked the treasure */
  classes[5].red[6] = "No";     /* 2 B red raid failed */
  return { milestones: ms, classes: classes };
}

function shortLabel(s) {
  return String(s).trim().replace(/^beta.*$/i, "Beta").replace(/^v\s*/i, "V");
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function chestSVG(state) {
  /* state: pending (closed), found (open + glowing loot), empty (open, nothing) */
  var open = state !== "pending";
  var lid = open
    ? '<rect class="lid" x="1" y="0" width="14" height="3" rx="1"></rect>'
    : '<rect class="lid" x="1" y="3" width="14" height="4" rx="1"></rect>';
  var inside = open
    ? '<rect class="inside" x="3" y="6" width="10" height="3"></rect>'
    : "";
  var gems = state === "found"
    ? '<rect class="gem" x="5" y="6.6" width="1.6" height="1.6"></rect>' +
      '<rect class="gem" x="9.4" y="6.6" width="1.6" height="1.6"></rect>'
    : "";
  var latch = open ? "" : '<rect class="latch" x="7" y="6" width="2" height="3"></rect>';
  return '<svg viewBox="0 0 16 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect class="body" x="1" y="' + (open ? 5 : 6) + '" width="14" height="' + (open ? 8 : 7) + '" rx="1"></rect>' +
    inside + gems + lid + latch + "</svg>";
}

function cellHTML(raw, isLast, label, extra) {
  extra = extra || "";
  if (isLast) {
    var state = isDone(raw) ? "found" : isFail(raw) ? "empty" : "pending";
    return '<div class="cellbox chest ' + state + extra + '" title="' + esc(label) + ' — treasure raid">' + chestSVG(state) + "</div>";
  }
  return '<div class="cellbox ' + (isDone(raw) ? "done" : "todo") + extra + '" title="' + esc(label) + '">' +
    esc(shortLabel(label)) + "</div>";
}

function renderRail(data) {
  var teams = data.classes.length;
  var track = document.getElementById("rail");
  track.style.gridTemplateColumns = "repeat(" + data.milestones.length + ", 1fr)";
  var t = treasureInfo(data.milestones);
  var currentFound = t.week >= 0;
  track.innerHTML = data.milestones.map(function (m, j) {
    var ticks = 0;
    data.classes.forEach(function (c) {
      if (isDone(c.blue[j]) && isDone(c.red[j])) ticks++;
    });
    var cls = "";
    if (j === t.week) cls = "now";
    else if (ticks >= teams && teams > 0) cls = "done";
    else if (!currentFound) { cls = "now"; currentFound = true; }
    var tr = isTreasureCol(t, j);
    return '<div class="commit ' + cls + (tr ? " tr" : "") + '">' +
      '<div class="node"></div>' +
      '<div class="tag">' + (tr ? '<span class="mini chest pending">' + chestSVG("pending") + "</span>" : "") +
        esc(shortLabel(m)) + "</div>" +
      '<div class="count">' + ticks + "/" + teams + "</div>" +
      (function () {
        var isHack = CONFIG.nextWeek && verKey(m) === verKey(CONFIG.nextWeek.ver);
        var hackStyle = ' style="background:linear-gradient(90deg,var(--red),var(--blue));color:#fff"';
        if (j === t.week) return '<div class="wkflag"' + (isHack ? hackStyle : "") + ">This week" +
          (isHack ? " · hack!" : "") + "</div>";
        if (isHack) return '<div class="wkflag"' + hackStyle + ">Next week · hack!</div>";
        return "";
      })() +
      "</div>";
  }).join("");
}

/* Treasure strip across the top: driven by CONFIG only, so it shows even if the sheet fails. */
function renderHoard() {
  var keys = Object.keys(CONFIG.treasures);
  var raid = !!CONFIG.nextWeek && verKey(CONFIG.thisWeek || "") === verKey(CONFIG.nextWeek.ver);
  var weekIdx = -1;
  keys.forEach(function (k, i) { if (verKey(k) === verKey(CONFIG.thisWeek || "")) weekIdx = i; });
  var treasureCards = keys.map(function (k, i) {
    var tr = CONFIG.treasures[k];
    var isLast = i === weekIdx;
    var isPast = raid || weekIdx < 0 || i < weekIdx;
    var stat = isLast
      ? (i === keys.length - 1 ? "This week · the last one!" : "This week")
      : isPast ? (raid ? "✓ Hidden" : "✓ Should be hidden") : "Coming up";
    return '<div class="tcard ' + (isLast ? "last" : isPast ? "past" : "") + '">' +
      '<div class="tchest chest pending">' + chestSVG("pending") +
        (isPast ? '<span class="ttick">✓</span>' : "") + "</div>" +
      '<div style="min-width:0">' +
        '<div class="tver">Treasure ' + (i + 1) + " · " + esc(shortLabel(k)) + "</div>" +
        '<div class="tname">' + esc(tr.name) + "</div>" +
        '<div class="tplain">' + esc(tr.plain) + "</div>" +
        '<span class="tstat">' + esc(stat) + "</span>" +
      "</div></div>";
  }).join("");
  var html = treasureCards;
  if (CONFIG.nextWeek && raid) {
    /* treasures burst out of an open chest, on a loop */
    var LOOT = [
      { t: "IP",   c: "#3fcf7a", dx: -5.6, dy: -3.4 },
      { t: "PORT", c: "#4a9eea", dx: -2.7, dy: -5.6 },
      { t: "KEY",  c: "#f5b83d", dx:  2.7, dy: -5.6 },
      { t: "SEED", c: "#ff6b9a", dx:  5.6, dy: -3.4 }
    ];
    var loot = LOOT.map(function (l, i) {
      return '<span class="loot" style="--dx:' + l.dx + "em;--dy:" + l.dy + "em;--d:" + (i * 0.35) +
        "s;background:" + l.c + '">' + l.t + "</span>";
    }).join("");
    var sparks = [[-6, -1.5], [-3.2, -7.5], [0, -8.5], [3.2, -7.5], [6, -1.5], [-0.2, -4.5]].map(function (p, i) {
      return '<span class="spark" style="--dx:' + p[0] + "em;--dy:" + p[1] + "em;--d:" + (0.15 + i * 0.27) + 's"></span>';
    }).join("");
    html += '<div class="tcard next live">' +
      '<div class="stage" aria-hidden="true"><div class="beam"></div>' + sparks + loot +
        '<div class="bigchest chest found">' + chestSVG("found") + "</div></div>" +
      '<div style="min-width:0">' +
        '<div class="tver">This week · ' + esc(CONFIG.nextWeek.ver) + " ⚔️</div>" +
        '<div class="tname">' + esc(CONFIG.nextWeek.title) + "</div>" +
        '<div class="tplain">' + CONFIG.nextWeek.text + "</div>" +
      "</div></div>";
  }
  var hoard = document.getElementById("hoard");
  if (raid) {
    hoard.classList.add("raid");
    hoard.classList.remove("tworow");
    hoard.innerHTML = html;
  } else {
    hoard.classList.remove("raid");
    hoard.classList.add("tworow");
    var finals = "";
    if (CONFIG.thisWeekCard) {
      var a = CONFIG.thisWeekCard;
      finals += '<div class="tcard last adventure">' +
        '<div class="advicon">' + (a.icon || "🗺️") + "</div>" +
        '<div style="min-width:0">' +
          '<div class="tver">This week · ' + esc(a.ver) + "</div>" +
          '<div class="tname">' + esc(a.title) + "</div>" +
          '<div class="tplain">' + a.text + "</div>" +
          '<span class="tstat">This week</span>' +
        "</div></div>";
    }
    if (CONFIG.nextWeek) {
      finals += '<div class="tcard next">' +
        '<div class="tver">Next week · ' + esc(CONFIG.nextWeek.ver) + " ⚔️</div>" +
        '<div class="tname">' + esc(CONFIG.nextWeek.title) + "</div>" +
        '<div class="tplain">' + CONFIG.nextWeek.text + "</div>" +
      "</div>";
    }
    hoard.innerHTML =
      '<div class="hrow treasures">' + treasureCards + "</div>" +
      '<div class="hrow finals">' + finals + "</div>";
  }
  document.getElementById("hoardTitle").textContent = raid
    ? "All 4 treasures hidden ✓ Now raid the other team!"
    : "Your 4 hidden treasures — then this week's adventure-mode check";
  document.getElementById("hoardNote").textContent = CONFIG.sideNote ? "· " + CONFIG.sideNote : "";
}

function renderGrid(data) {
  var n = data.milestones.length;
  var t = treasureInfo(data.milestones);
  function labels() {
    return '<div class="striplab">' + data.milestones.map(function (m, j) {
      var tr = isTreasureCol(t, j);
      return '<div class="lab' + (tr ? " tr" : "") + (j === t.week ? " wk" : "") + '">' +
        '<span class="mini chest pending">' + (tr ? chestSVG("pending") : "") + "</span>" +
        esc(shortLabel(m)) + "</div>";
    }).join("") + "</div>";
  }
  var hidTotal = '<div class="teamtotal hid">0<small>/' + n + "</small></div>";
  document.getElementById("gridhead").innerHTML = '<div class="row head">' +
    '<div></div><div>Class</div>' +
    '<div class="teamgroup"><div><span class="teamword red">Red Team</span>' + labels() + "</div>" + hidTotal + "</div>" +
    '<div class="teamgroup"><div><span class="teamword blue">Blue Team</span>' + labels() + "</div>" + hidTotal + "</div>" +
    "</div>";

  /* each team scores its own /7; classes ranked by the two combined,
     ties broken by milestones where both teams are done */
  var order = data.classes.map(function (c) {
    var bt = 0, rt = 0, both = 0;
    for (var j = 0; j < n; j++) {
      var b = isDone(c.blue[j]), r = isDone(c.red[j]);
      if (b) bt++;
      if (r) rt++;
      if (b && r) both++;
    }
    return { c: c, bt: bt, rt: rt, both: both };
  }).sort(function (a, b) {
    return (b.bt + b.rt) - (a.bt + a.rt) || (b.both - a.both);
  });

  var rowsHTML = order.map(function (e, i) {
    function group(team, cells, total) {
      var strip = '<div class="strip ' + team + '">' + cells.map(function (raw, j) {
        return cellHTML(raw, j === n - 1, data.milestones[j],
          (isTreasureCol(t, j) ? " tr" : "") + (j === t.week ? " wk" : ""));
      }).join("") + "</div>";
      return '<div class="teamgroup">' + strip +
        '<div class="teamtotal ' + team + '">' + total + "<small>/" + n + "</small></div></div>";
    }
    return '<div class="row">' +
      '<div class="rank' + (i === 0 ? " r1" : "") + '">' + (i + 1) + "</div>" +
      '<div class="name">' + esc(e.c.name) + "</div>" +
      group("red", e.c.red, e.rt) +
      group("blue", e.c.blue, e.bt) +
      "</div>";
  }).join("");

  var list = document.getElementById("scrolllist");
  var scroller = document.getElementById("scroller");
  list.classList.remove("anim");
  list.style.transform = "";
  list.innerHTML = rowsHTML;

  /* animate only when the list overflows the screen */
  requestAnimationFrame(function () {
    var oneCopy = list.scrollHeight;
    if (oneCopy > scroller.clientHeight + 2) {
      var gap = parseFloat(getComputedStyle(list).rowGap) || 0;
      list.innerHTML = rowsHTML + rowsHTML;       /* second copy for a seamless loop */
      list.style.setProperty("--loop", (oneCopy + gap) + "px");
      list.style.setProperty("--dur", (order.length * CONFIG.secondsPerRow) + "s");
      list.classList.add("anim");
    }
  });
}

function setSync(text, stale) {
  document.getElementById("sync").classList.toggle("stale", !!stale);
  document.getElementById("syncText").textContent = text;
}
function banner(msg, isError) {
  var el = document.getElementById("banner");
  el.textContent = msg || "";
  el.classList.toggle("show", !!msg);
  el.classList.toggle("error", !!isError);
}

async function refresh() {
  if (!CONFIG.sheetCsvUrl) {
    var d = applyOverrides(demoData());
    renderRail(d); renderGrid(d);
    setSync("demo mode", true);
    return;
  }
  try {
    var res = await fetch(CONFIG.sheetCsvUrl, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    var data = parseSheet(parseCSV(await res.text()));
    if (!data.classes.length) throw new Error("no class rows found");
    applyOverrides(data);
    renderRail(data); renderGrid(data);
    setSync("synced " + new Date().toLocaleTimeString("en-AU",
      { hour: "2-digit", minute: "2-digit" }));
    banner("");
  } catch (e) {
    var d2 = applyOverrides(demoData());
    renderRail(d2); renderGrid(d2);
    setSync("sync failed — demo data", true);
    banner("Could not read the sheet (" + e.message + "). Showing demo data.", true);
  }
}

renderHoard();
refresh();
setInterval(refresh, CONFIG.refreshSeconds * 1000);
</script>
</body>
</html>
