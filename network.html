<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPARK Centre Network Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
  :root {
    box-sizing: border-box;
    --bg0: #0D1C38;
    --bg1: #142A52;
    --card: #1B3158;
    --card-edge: #4466A0;
    --ink: #F7FBFF;
    --muted: #BACDEA;
    --faint: #93AACB;
    --line: #5878AE;
    --cyan: #6EF2FF;
    --amber: #FFC872;
    --red: #FF7676;
    --blue: #80B6FF;
    --green: #6DFFC2;
    --violet: #CBAEFF;
    --wifi: #ACD0FF;
    --zone-dns: rgba(110,242,255,0.08);
    --zone-battle: rgba(255,118,118,0.075);
    --grid-dot: rgba(160,186,224,0.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  html, body { height: 100%; }
  * , *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    overflow-x: hidden;
    background:
      radial-gradient(1100px 900px at 50% 8%, #1E3F78 0%, rgba(30,63,120,0) 65%),
      radial-gradient(900px 700px at 50% 85%, #172F5C 0%, rgba(23,47,92,0) 70%),
      var(--bg0);
    color: var(--ink);
    font-family: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  }
  .wrap {
    height: 100vh;
    height: 100dvh;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg.map {
    display: block;
    width: 100%;
    height: 100%;
  }
  text { font-family: "Chakra Petch", "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace; }

  .h-title { font-size: 42px; font-weight: 700; fill: var(--ink); letter-spacing: 0.5px; }
  .h-sub { font-size: 17px; fill: var(--muted); }
  .h-net { font-size: 17px; fill: var(--green); }

  .zone { fill: var(--zone-dns); stroke: rgba(110,242,255,0.42); stroke-width: 1.4; stroke-dasharray: 4 5; rx: 18; }
  .zone-battle { fill: var(--zone-battle); stroke: rgba(255,118,118,0.45); }
  .zone-label { font-size: 13.5px; fill: var(--cyan); font-weight: 600; letter-spacing: 1px; opacity: 0.9; }
  .zone-label-battle { fill: var(--red); }

  .edge { fill: none; stroke: var(--line); stroke-width: 2.6; }
  .edge-flow { fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 1.4s linear infinite; }
  .flow-main { stroke: var(--green); }
  .flow-dns { stroke: var(--cyan); animation-duration: 1.8s; }
  .flow-mesh { stroke: var(--amber); animation-duration: 1.6s; }
  .flow-battle-r { stroke: var(--red); animation-duration: 1.2s; }
  .flow-battle-b { stroke: var(--blue); animation-duration: 1.2s; }
  .flow-file { stroke: var(--violet); animation-duration: 2.2s; }
  @keyframes flow { to { stroke-dashoffset: -24; } }

  .wireless { stroke: var(--amber); stroke-width: 2.4; stroke-dasharray: 7 6; fill: none; }
  .wifi-edge { stroke: var(--wifi); stroke-width: 2.2; stroke-dasharray: 4 5; fill: none; opacity: 0.95; }
  .flow-wifi { stroke: var(--wifi); animation-duration: 2s; }

  .panel { fill: rgba(27,49,88,0.85); stroke: var(--card-edge); stroke-width: 1.5; rx: 14; filter: url(#cardShadow); }
  .panel-h { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel-sub { font-size: 11px; fill: var(--faint); }
  .tile { fill: rgba(160,186,224,0.11); stroke: rgba(160,186,224,0.36); rx: 9; transition: stroke 0.15s ease; }
  g.tilegrp:hover .tile { stroke: var(--wifi); }
  .tile-t { font-size: 12px; fill: var(--ink); font-weight: 500; }
  .tile-s { font-size: 10px; fill: var(--muted); }

  .edge-label { font-size: 12.5px; fill: var(--muted); }
  .edge-label-strong { font-size: 12.5px; fill: var(--amber); }

  .node rect.body {
    fill: var(--card);
    stroke: var(--card-edge);
    stroke-width: 1.6;
    rx: 12;
    filter: url(#cardShadow);
    transition: stroke 0.15s ease;
  }
  .node:hover rect.body { stroke: var(--green); }
  .node.n-dns:hover rect.body { stroke: var(--cyan); }
  .node.n-mesh:hover rect.body { stroke: var(--amber); }
  .node.n-red:hover rect.body { stroke: var(--red); }
  .node.n-blue:hover rect.body { stroke: var(--blue); }
  .node.n-file:hover rect.body { stroke: var(--violet); }

  .n-name { font-size: 15.5px; font-weight: 600; fill: var(--ink); }
  .n-name-sm { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .n-role { font-size: 11.5px; fill: var(--muted); }
  .n-ip { font-size: 12.5px; fill: var(--green); }
  .n-ip-c { fill: var(--cyan); }
  a:hover .n-ip { text-decoration: underline; }

  .chip { fill: rgba(160,186,224,0.16); stroke: rgba(160,186,224,0.45); rx: 8; }
  .chip-t { font-size: 10.5px; fill: var(--muted); font-weight: 500; }
  .chip-dns { fill: rgba(110,242,255,0.15); stroke: rgba(110,242,255,0.55); }
  .chip-dns-t { fill: var(--cyan); }
  .chip-warn { fill: rgba(255,200,114,0.15); stroke: rgba(255,200,114,0.6); }
  .chip-warn-t { fill: var(--amber); }
  .chip-red { fill: rgba(255,118,118,0.15); stroke: rgba(255,118,118,0.6); }
  .chip-red-t { fill: var(--red); }
  .chip-blue { fill: rgba(128,182,255,0.15); stroke: rgba(128,182,255,0.6); }
  .chip-blue-t { fill: var(--blue); }
  .chip-vio { fill: rgba(203,174,255,0.15); stroke: rgba(203,174,255,0.6); }
  .chip-vio-t { fill: var(--violet); }
  .chip-green { fill: rgba(109,255,194,0.15); stroke: rgba(109,255,194,0.6); }
  .chip-green-t { fill: var(--green); }

  .icon { stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-pad { fill: rgba(160,186,224,0.12); stroke: rgba(160,186,224,0.38); rx: 10; }

  .status { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .legend-t { font-size: 13px; fill: var(--muted); }
  .legend-h { font-size: 14px; fill: var(--ink); font-weight: 600; }
  .foot { font-size: 13.5px; fill: var(--faint); }

  .sat-ring { animation: satspin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes satspin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .edge-flow, .status, .sat-ring, .packet { animation: none !important; }
    .packets { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <svg class="map" viewBox="0 0 1080 1880" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SPARK Centre network map">
    <defs>
      <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
      </filter>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="4.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
        <circle cx="1.2" cy="1.2" r="1.2" fill="var(--grid-dot)"/>
      </pattern>

      <!-- edge paths (reused by packets) -->
      <path id="p-wan"    d="M 540 364 C 540 500, 540 600, 540 720"/>
      <path id="p-trunk"  d="M 540 830 C 540 880, 540 910, 540 950"/>
      <path id="p-dns1"   d="M 590 1032 C 600 1110, 720 1120, 727 1190"/>
      <path id="p-dns2"   d="M 640 1032 C 660 1090, 905 1090, 911 1190"/>
      <path id="p-dns3"   d="M 560 1032 C 600 1090, 636 1090, 636 1180 L 636 1400 C 636 1418, 642 1429, 652 1429"/>
      <path id="p-dns4"   d="M 615 1032 C 625 1090, 819 1090, 819 1180 L 819 1400 C 819 1418, 826 1429, 836 1429"/>
      <path id="p-file"   d="M 654 991 C 700 991, 735 991, 780 991"/>
      <path id="p-mesh"   d="M 416 805 C 330 820, 240 860, 220 940"/>
      <path id="p-m2s"    d="M 220 1038 C 225 1090, 300 1100, 304 1150"/>
      <path id="p-red"    d="M 278 1224 C 240 1264, 200 1294, 172 1328"/>
      <path id="p-blue"   d="M 332 1224 C 380 1264, 440 1294, 482 1328"/>
      <path id="p-disp"   d="M 470 720 C 460 670, 320 650, 300 598"/>
      <path id="p-class"  d="M 610 720 C 620 670, 780 660, 800 608"/>
    </defs>

    <rect x="0" y="0" width="1080" height="1880" fill="url(#dots)"/>

    <!-- ===================== HEADER ===================== -->
    <g>
      <text class="h-title" x="40" y="80">SPARK Centre network</text>
      <text class="h-sub" x="40" y="114">Boneo Primary School, hands-on technology classroom</text>
      <circle cx="46" cy="142" r="5" fill="var(--green)" class="status" filter="url(#glow)"/>
      <text class="h-net mono" x="60" y="148">192.168.8.0/24</text>
      <text class="h-sub" x="222" y="148">Starlink uplink, GL.iNet core, quad AdGuard DNS</text>
    </g>

    <!-- ===================== ZONES ===================== -->
    <rect class="zone" x="620" y="1110" width="406" height="430" rx="18"/>
    <text class="zone-label" x="644" y="1524">DNS SHIELD GRID, FOUR ADGUARD RESOLVERS</text>

    <rect class="zone zone-battle" x="24" y="1110" width="582" height="430" rx="18"/>
    <text class="zone-label zone-label-battle" x="48" y="1524">CYBER BATTLEGROUND, MINECRAFT RED VS BLUE</text>

    <!-- ===================== EDGES ===================== -->
    <!-- WAN beam -->
    <use href="#p-wan" class="edge"/>
    <use href="#p-wan" class="edge-flow flow-main"/>
    <text class="edge-label" x="554" y="410">Starlink WAN uplink</text>

    <!-- trunk -->
    <use href="#p-trunk" class="edge"/>
    <use href="#p-trunk" class="edge-flow flow-main"/>
    <text class="edge-label" x="554" y="895">LAN trunk</text>

    <!-- DNS fan -->
    <use href="#p-dns1" class="edge"/><use href="#p-dns1" class="edge-flow flow-dns"/>
    <use href="#p-dns2" class="edge"/><use href="#p-dns2" class="edge-flow flow-dns"/>
    <use href="#p-dns3" class="edge"/><use href="#p-dns3" class="edge-flow flow-dns"/>
    <use href="#p-dns4" class="edge"/><use href="#p-dns4" class="edge-flow flow-dns"/>

    <!-- file server -->
    <use href="#p-file" class="edge"/>
    <use href="#p-file" class="edge-flow flow-file"/>
    <text class="edge-label" x="702" y="980">SMB</text>

    <!-- mesh backhaul (wireless) -->
    <use href="#p-mesh" class="wireless"/>
    <use href="#p-mesh" class="edge-flow flow-mesh"/>
    <text class="edge-label-strong" x="40" y="880">wireless mesh backhaul</text>

    <!-- mesh to 10 port -->
    <use href="#p-m2s" class="edge"/>
    <use href="#p-m2s" class="edge-flow flow-mesh"/>

    <!-- battle links -->
    <use href="#p-red" class="edge"/><use href="#p-red" class="edge-flow flow-battle-r"/>
    <use href="#p-blue" class="edge"/><use href="#p-blue" class="edge-flow flow-battle-b"/>

    <!-- Wi-Fi client links -->
    <use href="#p-disp" class="wifi-edge"/>
    <use href="#p-disp" class="edge-flow flow-wifi"/>
    <use href="#p-class" class="wifi-edge"/>
    <use href="#p-class" class="edge-flow flow-wifi"/>

    <!-- ===================== DISPLAY WALL ===================== -->
    <g class="node" transform="translate(-21 282)">
      <rect class="panel" x="60" y="148" width="472" height="166"/>
      <text class="panel-h" x="76" y="172">Display wall</text>
      <text class="panel-sub" x="186" y="172">Wi-Fi screens on the main router, live dashboards</text>

      <!-- Starlink stats -->
      <g class="tilegrp">
        <rect class="tile" x="76" y="184" width="140" height="52"/>
        <g class="icon" stroke="var(--green)">
          <rect x="88" y="196" width="20" height="13" rx="2"/>
          <line x1="95" y1="212" x2="101" y2="212"/>
          <circle cx="98" cy="202.5" r="1.5" fill="var(--green)"/>
          <path d="M 94 200 q 4 -4 8 0" stroke-width="1.2"/>
        </g>
        <text class="tile-t" x="118" y="206">starlink</text>
        <text class="tile-s" x="118" y="220">dish stats</text>
      </g>
      <!-- Heartbeat -->
      <g class="tilegrp">
        <rect class="tile" x="228" y="184" width="140" height="52"/>
        <g class="icon" stroke="var(--red)">
          <rect x="240" y="196" width="20" height="13" rx="2"/>
          <line x1="247" y1="212" x2="253" y2="212"/>
          <path d="M 243 203 h 4 l 2 -4 l 3 7 l 2 -3 h 3" stroke-width="1.3"/>
        </g>
        <text class="tile-t" x="270" y="206">heartbeat</text>
        <text class="tile-s" x="270" y="220">network pulse</text>
      </g>
      <!-- Mempool -->
      <g class="tilegrp">
        <rect class="tile" x="380" y="184" width="140" height="52"/>
        <g class="icon" stroke="var(--amber)">
          <rect x="392" y="196" width="20" height="13" rx="2"/>
          <line x1="399" y1="212" x2="405" y2="212"/>
          <rect x="395" y="199" width="4" height="7" fill="var(--amber)" stroke="none"/>
          <rect x="400" y="201" width="4" height="5" fill="var(--amber)" stroke="none" opacity="0.7"/>
          <rect x="405" y="198" width="4" height="8" fill="var(--amber)" stroke="none" opacity="0.5"/>
        </g>
        <text class="tile-t" x="422" y="206">mempool</text>
        <text class="tile-s" x="422" y="220">bitcoin blocks</text>
      </g>
      <!-- Uptime board -->
      <g class="tilegrp">
        <rect class="tile" x="76" y="246" width="140" height="52"/>
        <g class="icon" stroke="var(--green)">
          <rect x="88" y="258" width="20" height="13" rx="2"/>
          <line x1="95" y1="274" x2="101" y2="274"/>
          <path d="M 94 264 l 3 3 l 6 -6" stroke-width="1.4"/>
        </g>
        <text class="tile-t" x="118" y="268">uptime</text>
        <text class="tile-s" x="118" y="282">Kuma board</text>
      </g>
      <!-- Weather -->
      <g class="tilegrp">
        <rect class="tile" x="228" y="246" width="140" height="52"/>
        <g class="icon" stroke="var(--cyan)">
          <rect x="240" y="258" width="20" height="13" rx="2"/>
          <line x1="247" y1="274" x2="253" y2="274"/>
          <circle cx="248" cy="264" r="2.4"/>
          <line x1="248" y1="259.5" x2="248" y2="260.5" stroke-width="1.1"/>
          <line x1="252.5" y1="264" x2="253.5" y2="264" stroke-width="1.1"/>
          <line x1="242.5" y1="264" x2="243.5" y2="264" stroke-width="1.1"/>
        </g>
        <text class="tile-t" x="270" y="268">weather</text>
        <text class="tile-s" x="270" y="282">Boneo sky</text>
      </g>
      <!-- Big screen -->
      <g class="tilegrp">
        <rect class="tile" x="380" y="246" width="140" height="52"/>
        <g class="icon" stroke="var(--muted)">
          <rect x="390" y="256" width="24" height="15" rx="2"/>
          <line x1="399" y1="274" x2="406" y2="274"/>
          <line x1="402.5" y1="271" x2="402.5" y2="274"/>
        </g>
        <text class="tile-t" x="422" y="268">bigSCREEN</text>
        <text class="tile-s" x="422" y="282">85 inch hub</text>
      </g>
    </g>

    <!-- ===================== CLASSROOM CLIENTS ===================== -->
    <g class="node" transform="translate(-349 366)">
      <rect class="panel" x="920" y="64" width="470" height="176"/>
      <text class="panel-h" x="936" y="90">Classroom clients</text>
      <text class="panel-sub" x="1086" y="90">student and staff gear, addresses hidden on purpose</text>

      <!-- Minecraft rigs -->
      <g class="tilegrp">
        <rect class="tile" x="936" y="102" width="140" height="52"/>
        <g class="icon" stroke="var(--green)">
          <rect x="948" y="114" width="12" height="12" rx="1.5"/>
          <rect x="953" y="109" width="12" height="12" rx="1.5"/>
        </g>
        <text class="tile-t" x="974" y="124">minecraft rigs</text>
        <text class="tile-s" x="974" y="138">3x ThinkCentre</text>
      </g>
      <!-- Teacher laptop -->
      <g class="tilegrp">
        <rect class="tile" x="1088" y="102" width="140" height="52"/>
        <g class="icon" stroke="var(--muted)">
          <rect x="1100" y="112" width="20" height="12" rx="2"/>
          <path d="M 1097 127 h 26 l -3 -3 h -20 z" stroke-width="1.3"/>
        </g>
        <text class="tile-t" x="1130" y="124">teacher1</text>
        <text class="tile-s" x="1130" y="138">staff laptop</text>
      </g>
      <!-- Arcade -->
      <g class="tilegrp">
        <rect class="tile" x="1240" y="102" width="136" height="52"/>
        <g class="icon" stroke="var(--violet)">
          <rect x="1250" y="114" width="22" height="12" rx="5"/>
          <circle cx="1266" cy="120" r="1.3" fill="var(--violet)"/>
          <line x1="1256" y1="118" x2="1256" y2="122"/>
          <line x1="1254" y1="120" x2="1258" y2="120"/>
        </g>
        <text class="tile-t" x="1280" y="124">arcade</text>
        <text class="tile-s" x="1280" y="138">MakeCode wall</text>
      </g>
      <!-- Green screen -->
      <g class="tilegrp">
        <rect class="tile" x="936" y="164" width="140" height="52"/>
        <g class="icon" stroke="var(--green)">
          <rect x="948" y="176" width="22" height="14" rx="2"/>
          <line x1="951" y1="176" x2="951" y2="172"/>
          <line x1="967" y1="176" x2="967" y2="172"/>
          <rect x="952" y="180" width="14" height="7" fill="rgba(109,255,194,0.4)" stroke="none"/>
        </g>
        <text class="tile-t" x="978" y="186">greenscreen</text>
        <text class="tile-s" x="978" y="200">video studio</text>
      </g>
      <!-- STEM rig -->
      <g class="tilegrp">
        <rect class="tile" x="1088" y="164" width="140" height="52"/>
        <g class="icon" stroke="var(--blue)">
          <rect x="1102" y="172" width="12" height="20" rx="2"/>
          <line x1="1105" y1="177" x2="1111" y2="177"/>
          <circle cx="1108" cy="186" r="1.4" fill="var(--blue)"/>
        </g>
        <text class="tile-t" x="1130" y="186">STEM</text>
        <text class="tile-s" x="1130" y="200">build machine</text>
      </g>
      <!-- Printer -->
      <g class="tilegrp">
        <rect class="tile" x="1240" y="164" width="136" height="52"/>
        <g class="icon" stroke="var(--muted)">
          <rect x="1252" y="180" width="20" height="10" rx="2"/>
          <path d="M 1256 180 v -5 h 12 v 5"/>
          <rect x="1256" y="187" width="12" height="6" rx="1"/>
        </g>
        <text class="tile-t" x="1280" y="186">printer</text>
        <text class="tile-s" x="1280" y="200">paper jams</text>
      </g>
    </g>

    <!-- ===================== STARLINK ===================== -->
    <g class="node" transform="translate(-180 236)">
      <g class="sat-ring" opacity="0.75">
        <circle cx="720" cy="64" r="52" fill="none" stroke="var(--line)" stroke-width="1.3" stroke-dasharray="4 8"/>
        <circle cx="720" cy="12" r="3.4" fill="var(--green)"/>
      </g>
      <g filter="url(#glow)">
        <!-- satellite icon -->
        <g class="icon" stroke="var(--ink)">
          <rect x="706" y="52" width="28" height="20" rx="3"/>
          <rect x="678" y="56" width="22" height="12" rx="2" stroke="var(--cyan)"/>
          <rect x="740" y="56" width="22" height="12" rx="2" stroke="var(--cyan)"/>
          <line x1="700" y1="62" x2="706" y2="62"/>
          <line x1="734" y1="62" x2="740" y2="62"/>
          <path d="M 714 80 q 6 8 12 0" stroke="var(--green)"/>
          <path d="M 710 86 q 10 12 20 0" stroke="var(--green)" opacity="0.7"/>
        </g>
      </g>
      <text class="n-name-sm" x="720" y="36" text-anchor="middle">Starlink</text>
      <text class="n-role" x="720" y="112" text-anchor="middle">low earth orbit internet</text>
    </g>

    <!-- ===================== GL.iNet ROUTER ===================== -->
    <g class="node" transform="translate(-180 514)">
      <rect class="body" x="596" y="206" width="248" height="110"/>
      <rect class="icon-pad" x="612" y="226" width="44" height="44"/>
      <g class="icon" stroke="var(--green)">
        <rect x="620" y="246" width="28" height="13" rx="3"/>
        <line x1="626" y1="246" x2="626" y2="234"/>
        <line x1="642" y1="246" x2="642" y2="234"/>
        <circle cx="626" cy="252.5" r="1.4" fill="var(--green)"/>
        <circle cx="633" cy="252.5" r="1.4" fill="var(--green)"/>
