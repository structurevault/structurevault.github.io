<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPARK Arcade &mdash; Cartridge Library</title>
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#0b0f14;
    --panel:#131a22;
    --line:#22303e;
    --ink:#e8eef4;
    --dim:#7b8a99;
    --volt:#ffd60a;   /* spark yellow */
    --arc:#4dc3ff;    /* arc blue */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:ui-monospace,"Cascadia Mono","Menlo","Consolas",monospace;
    min-height:100vh;display:flex;flex-direction:column;
  }

  /* ============ HEADER ============ */
  header{
    position:sticky;top:0;z-index:10;
    background:rgba(11,15,20,.94);backdrop-filter:blur(4px);
    border-bottom:1px solid var(--line);
    padding:14px 20px 12px;
  }
  .head-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 auto}
  h1{
    margin:0;font-size:20px;letter-spacing:4px;font-weight:800;
    color:var(--volt);white-space:nowrap;
  }
  h1 .zap{color:var(--arc)}
  .subtag{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
  .spacer{flex:1}
  .search{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    color:var(--ink);font:inherit;font-size:14px;
    padding:8px 12px;min-width:220px;flex:0 1 320px;
  }
  .search::placeholder{color:var(--dim)}
  .search:focus{outline:none;border-color:var(--arc);box-shadow:0 0 10px rgba(77,195,255,.25)}
  .sort-btn{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    color:var(--ink);font:inherit;font-size:12px;letter-spacing:1px;
    padding:8px 12px;cursor:pointer;white-space:nowrap;
  }
  .sort-btn:hover{border-color:var(--arc)}
  .count{font-size:12px;color:var(--dim);white-space:nowrap}

  /* ============ STATUS ============ */
  .msg{margin:10px auto 0;padding:0 24px;font-size:13px;color:var(--dim)}
  .msg.err{color:#ff7a7a}
  .msg:empty{display:none}

  /* ============ SHELF ============ */
  main{flex:1;width:100%;margin:0 auto;padding:18px 24px 40px}
  #shelf{
    display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  }

  /* ============ CARTRIDGE (NES-style grey cart) ============ */
  .cart{
    --shell:#4dc3ff;                       /* per-game label colour */
    background:linear-gradient(180deg,#aaadb3 0%,#96999f 50%,#84878d 100%);
    border:1px solid #5e6167;
    border-radius:5px 5px 9px 9px;
    aspect-ratio:10 / 11;                  /* NES carts are a touch taller than wide */
    display:flex;flex-direction:column;
    padding:0 0 16px;
    position:relative;
    cursor:pointer;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.4), inset 2px 0 0 rgba(255,255,255,.14),
               inset -2px 0 0 rgba(0,0,0,.14), inset 0 -4px 0 rgba(0,0,0,.28),
               0 3px 10px rgba(0,0,0,.5);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cart:hover,.cart:focus-visible{
    transform:translateY(-4px);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.28),
               0 8px 20px rgba(0,0,0,.6), 0 0 0 2px var(--shell);
  }
  .cart:focus-visible{outline:none}
  .cart:active{transform:translateY(-1px)}
  /* top row: grip grooves on the left (like the NES shell), embossed logo on the right */
  .cart .top-row{
    display:flex;align-items:stretch;gap:12px;
    margin:11px 15px 10px;height:40px;flex:0 0 auto;
  }
  .cart .grip{
    flex:0 0 54%;
    background:repeating-linear-gradient(180deg,
      rgba(0,0,0,.26) 0 2px,
      rgba(255,255,255,.3) 2px 3px,
      rgba(0,0,0,0) 3px 8px);
    border-radius:2px;
  }
  /* moulded-in-the-plastic logo text */
  .cart .emboss{
    flex:1;display:flex;align-items:center;justify-content:flex-end;
    font-size:10px;font-weight:800;letter-spacing:2px;
    color:rgba(0,0,0,.32);
    text-shadow:0 1px 0 rgba(255,255,255,.45);
    user-select:none;white-space:nowrap;overflow:hidden;
  }
  /* moulded ejector notch, bottom-left */
  .cart::after{
    content:"";position:absolute;left:15px;bottom:6px;
    width:36px;height:5px;border-radius:3px;
    background:rgba(0,0,0,.28);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.3);
  }
  /* recessed screw dimple, bottom-right */
  .cart::before{
    content:"";position:absolute;right:14px;bottom:5px;
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #75787e, #4b4e53);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.35);
  }
  /* recessed label sticker */
  .cart .sticker{
    margin:0 15px 10px;flex:1;min-height:0;
    background:linear-gradient(165deg,#15191e 0%,#101418 45%,#0b0e12 100%);
    border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), inset 0 2px 5px rgba(0,0,0,.7),
               0 1px 0 rgba(255,255,255,.28);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  /* coloured band across the top of the label, like the classic stripe */
  .cart .band{
    height:16px;background:var(--shell);
    display:flex;align-items:center;
    padding:0 8px;
    font-size:8px;font-weight:800;letter-spacing:2px;color:rgba(0,0,0,.72);
    text-transform:uppercase;white-space:nowrap;overflow:hidden;
  }
  .cart .sticker-body{padding:10px 11px 11px;flex:1;min-height:0;display:flex;gap:11px;align-items:flex-start}
  .cart .icon{
    font-size:38px;line-height:1;flex:0 0 auto;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));
  }
  .cart .sticker-text{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100%}
  .cart .gname{
    font-size:16px;font-weight:800;line-height:1.25;
    color:#f2f5f8;
    overflow-wrap:anywhere;
  }
  .cart .who{margin-top:auto;padding-top:6px;font-size:11px;color:#8b98a5}
  .search:focus-visible,.sort-btn:focus-visible{
    outline:2px solid var(--arc);outline-offset:2px;
  }

  /* ============ EMPTY / ERROR ============ */
  .empty{display:none;text-align:center;padding:60px 20px;color:var(--dim)}
  .empty .big{font-size:18px;color:var(--ink);letter-spacing:2px;margin-bottom:8px}

  footer{
    border-top:1px solid var(--line);
    padding:12px 20px;text-align:center;
    font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;
  }

  /* ============ IN-PAGE PLAYER ============ */
  #player{
    display:none;position:fixed;top:0;left:0;
    width:100vw;height:100vh;height:100dvh;
    z-index:50;background:#000;
  }
  #player.open{display:block}
  #playerFrame{
    display:block;width:100%;height:100%;
    border:0;background:#000;
  }
  /* floating close button: doesn't steal any height from the game */
  .player-close{
    position:absolute;top:10px;right:10px;z-index:2;
    font:inherit;font-size:15px;font-weight:800;letter-spacing:1px;
    background:rgba(11,15,20,.82);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);padding:12px 20px;cursor:pointer;white-space:nowrap;
    min-height:52px;   /* big touch target for the Hub */
    backdrop-filter:blur(3px);
  }
  .player-close:hover{border-color:var(--arc)}
  .player-close:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
  body.playing{overflow:hidden}

  @media (prefers-reduced-motion:reduce){
    .cart{transition:none}
    .cart:hover,.cart:focus-visible{transform:none}
  }
  @media (max-width:520px){
    #shelf{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
    .search{min-width:0;flex:1 1 100%}
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1><span class="zap">&#9889;</span> SPARK ARCADE</h1>
    <span class="subtag">Cartridge library</span>
    <span class="spacer"></span>
    <input class="search" id="searchBox" type="search" placeholder="Search games, names, grades&#8230;" autocomplete="off" spellcheck="false" aria-label="Search games">
    <button class="sort-btn" id="sortBtn" title="Flip between newest-first and oldest-first">Sort: Newest</button>
    <span class="count" id="count"></span>
  </div>
</header>
<div class="msg" id="loadMsg">Loading games&hellip;</div>

<main>
  <div id="shelf"></div>
  <div class="empty" id="emptyState">
    <div class="big" id="emptyTitle">No games yet</div>
    <p id="emptyText">Games added to the spreadsheet appear here automatically.</p>
  </div>
</main>

<div id="player" role="dialog" aria-modal="true" aria-label="Game player">
  <iframe id="playerFrame" title="Game" allow="autoplay; fullscreen" src="about:blank"></iframe>
  <button class="player-close" id="playerClose" type="button">&#10005; Back to shelf</button>
</div>

<footer>SPARK Centre &bull; Boneo Primary School &bull; Free Play</footer>

<script>
(function(){
  "use strict";

  /* ---------- data source: published Google Sheet as CSV (no libraries needed) ---------- */
  const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQYOnFCDtaPGF_q7MDIkaXa8Bu8hjXR1rIMR1oZfND8uf8Z8An-VdEXty5WZL8OF7f3VHzLEYG4noED/pub?output=csv";
  const REFRESH_MS = 3 * 60 * 1000;   // re-check the sheet every 3 minutes

  let games = [];
  let query = "";
  let sortOrder = "newest";   // sheet rows are oldest-first

  const shelf = document.getElementById("shelf");
  const loadMsg = document.getElementById("loadMsg");
  const countEl = document.getElementById("count");
  const searchBox = document.getElementById("searchBox");
  const sortBtn = document.getElementById("sortBtn");
  const emptyState = document.getElementById("emptyState");
  const emptyTitle = document.getElementById("emptyTitle");
  const emptyText = document.getElementById("emptyText");

  /* ---------- makecode share ids ----------
     Two formats are in the wild:
       _LmgRUJatoKwY                  (lettered id -> makecode.com/_ID)
       50734-57996-78092-48491       (numbered id -> arcade.makecode.com/ID)
     Both open in the editor via arcade.makecode.com/#pub:ID.            */
  function extractId(input){
    input = String(input||"").trim();
    let m = input.match(/_[A-Za-z0-9]{8,}/);
    if (m) return m[0];
    m = input.match(/\d{4,6}(?:-\d{4,6}){2,}/);
    return m ? m[0] : null;
  }
  const editUrl = id => "https://arcade.makecode.com/#pub:" + id;
  // Same parameter set MakeCode's own big-screen kiosk app uses:
  //  fullscreen=1 -> sim height-fits the frame instead of width-sizing
  //                  (without it, the console shell hangs off the bottom)
  //  no hideSimButtons -> the shell's touchable D-pad + A/B buttons stay visible
  //  nofooter/single/autofocus -> clean single sim, keyboard focused
  const simUrl  = id => "https://arcade.makecode.com/---run?id=" + encodeURIComponent(id)
    + "&fullscreen=1&nofooter=1&single=1&autofocus=1";

  /* ---------- tiny CSV parser (handles quoted fields, commas, newlines) ---------- */
  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"'){
        inQuotes = true;
      } else if (c === ","){
        row.push(field); field = "";
      } else if (c === "\n" || c === "\r"){
        if (c === "\r" && text[i+1] === "\n") i++;
        row.push(field); field = "";
        rows.push(row); row = [];
      } else field += c;
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  /* ---------- rows -> games ---------- */
  function findCol(headers, needles, skipIdx){
    for (const n of needles){
      const i = headers.findIndex((h, idx) => idx !== skipIdx && h.includes(n));
      if (i > -1) return i;
    }
    return -1;
  }
  function cleanName(s){ return s.replace(/\s+/g," ").trim(); }

  /* ---------- keep the shelf classroom-friendly ----------
     Student-typed names come straight from the sheet, so any word on the
     naughty list (including l33t-ish disguises like f*ck / sh1t) gets swapped
     for a fun word instead. Swaps are stable per word, so a game keeps the
     same replacement every reload. */
  const RUDE_ANYWHERE = [   // matched inside words too (no innocent collisions)
    "fuck","fuk","fck","fuq","phuck","shit","shite","cunt","bitch","btch",
    "wank","bollock","slut","whore","dickhead","penis","vagina","boob","porn",
    "twat","nigga","nigger","retard","faggot"
  ];
  const RUDE_WHOLE_WORD = [ // only when the whole word matches (protects class/pass/assassin/arsenal/cockpit etc.)
    "ass","arse","crap","damn","dick","cock","piss","sex","sexy","hoe","thot",
    "hell","bugger","knob","prick","tit","tits","fag","willy","dang","frick","wtf","stfu",
    "sht","fk","fkc","cnt","dck","bch","pss",  // starred-out vowels: sh*t, f**k, etc.
    /* violent words — whole-word so Skill/Skills etc. stay untouched */
    "kill","kills","killer","killers","killing","killa",
    "murder","murderer","murderers","slay","slayer","slaughter","massacre",
    "bomb","bombs","bomber","bombers","bombing","nuke","nukes","grenade","grenades",
    "gun","guns","gunner","shooter","shooters","shoot","shooting",
    "sniper","snipers","stab","stabbing","terrorist","terrorists","assassin","assassins",
    /* death-related */
    "die","dies","died","dying","dead","death","deaths","deadly","undead","deadpool",
    "doom","doomed","blood","bloody","gore","gory","corpse","corpses","suicide","kys","kms"
  ];
  const FRIENDLY_SWAPS = ["Super","Mega","Turbo","Epic","Pixel","Banana","Rocket","Wacky","Sparkly","Bouncy"];
  const LEET = {"0":"o","1":"i","3":"e","4":"a","5":"s","7":"t","@":"a","$":"s","!":"i"};
  function friendlyWords(s){
    if (!s) return s;
    return s.split(/(\s+)/).map(tok => {
      if (/^\s*$/.test(tok)) return tok;
      const norm = tok.toLowerCase()
        .replace(/[013457@$!]/g, c => LEET[c])
        .replace(/[^a-z]/g, "");            // drops *, punctuation, digits already mapped
      if (!norm) return tok;
      const rude = RUDE_ANYWHERE.some(w => norm.includes(w)) || RUDE_WHOLE_WORD.includes(norm);
      if (!rude) return tok;
      let h = 0;
      for (let i = 0; i < tok.length; i++) h = (h * 31 + tok.charCodeAt(i)) >>> 0;
      return FRIENDLY_SWAPS[h % FRIENDLY_SWAPS.length];
    }).join("");
  }
  function rowsToGames(rows){
    if (!rows.length) return [];
    const headers = rows[0].map(h => String(h||"").trim().toLowerCase());
    const gameIdx  = findCol(headers, ["game name","game title","game"]);
    const urlIdx   = findCol(headers, ["makecode","share link","link","url"]);
    const gradeIdx = findCol(headers, ["grade","year level","year"]);
    const nameIdx  = findCol(headers, ["first name","student name","name"], gameIdx);
    const out = [];
    for (let r = 1; r < rows.length; r++){
      const row = rows[r];
      if (!row || !row.length) continue;
      const rawUrl = urlIdx > -1 ? String(row[urlIdx] ?? "").trim() : "";
      const id = extractId(rawUrl);
      if (!id) continue;
      out.push({
        id,
        name:  friendlyWords(nameIdx > -1 ? String(row[nameIdx] ?? "").trim() : ""),
        grade: gradeIdx > -1 ? String(row[gradeIdx] ?? "").trim() : "",
        game:  friendlyWords(cleanName(gameIdx > -1 ? String(row[gameIdx] ?? "") : ""))
      });
    }
    return out;   // oldest first
  }

  async function fetchGames(){
    const res = await fetch(SHEET_URL, {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    return rowsToGames(parseCSV(await res.text()));
  }

  async function refreshGames(isFirstLoad){
    try {
      const next = await fetchGames();
      const changed = JSON.stringify(next) !== JSON.stringify(games);
      games = next;
      loadMsg.textContent = "";
      loadMsg.className = "msg";
      if (changed || isFirstLoad) render();
    } catch(e){
      if (isFirstLoad){
        loadMsg.textContent = "Couldn't load games from the spreadsheet. Check the sheet is published and refresh the page.";
        loadMsg.className = "msg err";
      }
      console.error("SPARK Arcade: failed to load games", e);
    }
  }

  /* ---------- cartridge shell colours (picked per game, stable across reloads) ---------- */
  const SHELLS = ["#4dc3ff","#ffd60a","#ff6b6b","#7bd88f","#c792ea","#ff9e64"];
  function shellFor(id){
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return SHELLS[h % SHELLS.length];
  }

  /* ---------- label icons: matched from words in the game's name ---------- */
  const ICON_RULES = [
    /* --- specific things first, generic themes last --- */
    [/zombie|zomb/i,"\u{1F9DF}"], [/ghost|haunt|spooky/i,"\u{1F47B}"],
    [/vampire/i,"\u{1F9DB}"], [/witch/i,"\u{1F9D9}"], [/monster/i,"\u{1F47E}"],
    [/alien|invader|ufo|galaga/i,"\u{1F6F8}"], [/asteroid|meteor|comet/i,"\u2604\uFE0F"],
    [/moon|lunar/i,"\u{1F319}"], [/space|galaxy|star|rocket|astro|planet/i,"\u{1F680}"],
    [/dragon/i,"\u{1F409}"], [/dino|rex|raptor|jurassic/i,"\u{1F996}"], [/shark/i,"\u{1F988}"],
    [/whale/i,"\u{1F433}"], [/dolphin/i,"\u{1F42C}"], [/octopus|squid/i,"\u{1F419}"],
    [/crab/i,"\u{1F980}"], [/turtle|tortoise/i,"\u{1F422}"],
    [/fish|ocean|sea|under\s*water|aqua/i,"\u{1F41F}"],
    [/penguin/i,"\u{1F427}"], [/owl/i,"\u{1F989}"], [/chicken|chook|hen/i,"\u{1F414}"],
    [/bird|flappy|wing/i,"\u{1F426}"],
    [/snake/i,"\u{1F40D}"], [/spider|web/i,"\u{1F577}\uFE0F"],
    [/cat|kitten|kitty/i,"\u{1F431}"], [/dog|puppy|pup/i,"\u{1F436}"],
    [/fox/i,"\u{1F98A}"], [/wolf/i,"\u{1F43A}"], [/bear/i,"\u{1F43B}"],
    [/panda/i,"\u{1F43C}"], [/lion/i,"\u{1F981}"], [/tiger/i,"\u{1F42F}"],
    [/monkey|ape|gorilla/i,"\u{1F435}"], [/banana/i,"\u{1F34C}"],
    [/bunny|rabbit/i,"\u{1F430}"], [/mouse|rat|hamster/i,"\u{1F439}"],
    [/pig|hog/i,"\u{1F437}"], [/cow|moo/i,"\u{1F42E}"], [/sheep|lamb/i,"\u{1F411}"],
    [/duck/i,"\u{1F986}"], [/frog/i,"\u{1F438}"], [/bee|wasp/i,"\u{1F41D}"],
    [/bug|beetle|insect/i,"\u{1F41E}"], [/butterfly/i,"\u{1F98B}"],
    [/unicorn/i,"\u{1F984}"], [/horse|pony/i,"\u{1F40E}"], [/animal|zoo|pet/i,"\u{1F43E}"],
    [/kart/i,"\u{1F3CE}\uFE0F"], [/car|race|racing|drift|speed|drive|drag/i,"\u{1F3CE}\uFE0F"],
    [/truck|monster\s*truck/i,"\u{1F69A}"], [/tractor/i,"\u{1F69C}"],
    [/motor|bike\s*race|moto/i,"\u{1F3CD}\uFE0F"], [/bike|bmx|cycle/i,"\u{1F6B2}"],
    [/skate/i,"\u{1F6F9}"], [/surf/i,"\u{1F3C4}"], [/ski|snowboard/i,"\u26F7\uFE0F"],
    [/plane|jet|fly/i,"\u2708\uFE0F"], [/helicopter|chopper/i,"\u{1F681}"],
    [/pirate/i,"\u{1F3F4}\u200D\u2620\uFE0F"], [/boat|ship|sail|submarine/i,"\u{1F6A2}"],
    [/train|rail/i,"\u{1F682}"],
    [/soccer|football/i,"\u26BD"], [/basket/i,"\u{1F3C0}"], [/tennis/i,"\u{1F3BE}"],
    [/golf/i,"\u26F3"], [/cricket/i,"\u{1F3CF}"], [/baseball/i,"\u26BE"],
    [/bowl/i,"\u{1F3B3}"], [/hockey/i,"\u{1F3D2}"], [/pool|billiard|8\s*ball/i,"\u{1F3B1}"],
    [/dodge/i,"\u{1F94F}"], [/sport|ball/i,"\u{1F3D0}"],
    [/fishing/i,"\u{1F3A3}"], [/archer|arrow|bow/i,"\u{1F3F9}"], [/dart|target|aim/i,"\u{1F3AF}"],
    [/ninja/i,"\u{1F977}"], [/knight|castle|kingdom|medieval|dungeon/i,"\u{1F3F0}"],
    [/wizard|magic|spell|potion/i,"\u{1FA84}"],
    [/sword|battle|war|fight|combat|duel|clash/i,"\u2694\uFE0F"],
    [/shield|defen[cs]e|guard|protect/i,"\u{1F6E1}\uFE0F"],
    [/tower/i,"\u{1F5FC}"],
    [/gun|shoot|blast|laser|zap|pew/i,"\u{1F52B}"], [/bomb|boom|explo|blow/i,"\u{1F4A3}"],
    [/robot|bot|mech|cyborg/i,"\u{1F916}"],
    [/maze|labyrinth/i,"\u{1F300}"], [/puzzle/i,"\u{1F9E9}"],
    [/quiz|trivia|math|brain|memory|think/i,"\u{1F9E0}"],
    [/type|typing|word|spell(ing)?\b/i,"\u2328\uFE0F"],
    [/treasure|gold|coin|gem|diamond|loot|rich/i,"\u{1F48E}"],
    [/key|lock|door/i,"\u{1F5DD}\uFE0F"],
    [/parkour|obby|obstacle|gymnast|flip/i,"\u{1F938}"],
    [/run|runner|dash|escape|chase|sprint/i,"\u{1F3C3}"], [/jump|hop|bounce|leap/i,"\u{1F998}"],
    [/climb|mountain|cliff/i,"\u26F0\uFE0F"], [/lava|volcano/i,"\u{1F30B}"],
    [/ice|snow|frozen|winter|frost|blizzard/i,"\u2744\uFE0F"],
    [/fire|flame|burn|inferno/i,"\u{1F525}"],
    [/desert|sand|cactus/i,"\u{1F335}"], [/beach|island|tropic/i,"\u{1F3DD}\uFE0F"],
    [/forest|jungle|tree|wood/i,"\u{1F332}"], [/flower|garden|plant/i,"\u{1F33B}"],
    [/farm|harvest|crop/i,"\u{1F69C}"],
    [/pizza/i,"\u{1F355}"], [/burger/i,"\u{1F354}"], [/taco/i,"\u{1F32E}"],
    [/donut|doughnut/i,"\u{1F369}"], [/ice\s*cream|icecream/i,"\u{1F366}"],
    [/candy|sweet|lolly|choc/i,"\u{1F36C}"], [/cake|bake|cookie|biscuit/i,"\u{1F382}"],
    [/fruit|apple/i,"\u{1F34E}"], [/watermelon|melon/i,"\u{1F349}"],
    [/food|eat|snack|cook|kitchen|chef|caf[e\u00e9]|restaurant/i,"\u{1F373}"],
    [/scary|horror|creepy|nightmare|night|dark|shadow/i,"\u{1F311}"],
    [/music|dance|beat|song|rhythm|dj|piano|drum/i,"\u{1F3B5}"],
    [/mine|craft|dig|block|build/i,"\u26CF\uFE0F"],
    [/tycoon|shop|store|money|cash|bank|business/i,"\u{1F4B0}"],
    [/click|tap|idle/i,"\u{1F446}"],
    [/simulat/i,"\u{1F3AE}"], [/surviv/i,"\u{1F3D5}\uFE0F"],
    [/hero|super/i,"\u{1F9B8}"], [/princess|queen|king|royal|crown/i,"\u{1F451}"],
    [/boss/i,"\u{1F479}"], [/egg/i,"\u{1F95A}"], [/slime|goo/i,"\u{1FAE7}"],
    [/tank/i,"\u{1F69B}"], [/army|soldier|troop/i,"\u{1FA96}"],
    [/detective|mystery|spy|secret/i,"\u{1F575}\uFE0F"],
    [/doctor|hospital|nurse/i,"\u{1FA7A}"], [/school|class|teacher/i,"\u{1F3EB}"],
    [/city|town/i,"\u{1F3D9}\uFE0F"], [/sky|cloud/i,"\u2601\uFE0F"],
    [/rain/i,"\u{1F327}\uFE0F"], [/storm|thunder|lightning|spark|volt|electric/i,"\u26A1"],
    [/rainbow|colour|color/i,"\u{1F308}"], [/pixel|retro|arcade|8[\s-]?bit/i,"\u{1F47E}"],
    [/christmas|xmas|santa/i,"\u{1F384}"], [/hallow/i,"\u{1F383}"], [/easter/i,"\u{1F423}"],
    [/dream|sleep/i,"\u{1F4A4}"], [/time|clock/i,"\u23F0"], [/lucky|luck/i,"\u{1F340}"]
  ];
  const FALLBACK_ICONS = ["\u{1F3AE}","\u{1F579}\uFE0F","\u{1F47E}","\u{1F3B2}","\u{1F3AF}","\u{1F396}\uFE0F"];
  function iconFor(g){
    const name = g.game || "";
    for (const [re, icon] of ICON_RULES){
      if (re.test(name)) return icon;
    }
    // no keyword match: pick a stable generic gaming icon per game
    let h = 0;
    for (let i = 0; i < g.id.length; i++) h = (h * 33 + g.id.charCodeAt(i)) >>> 0;
    return FALLBACK_ICONS[h % FALLBACK_ICONS.length];
  }

  /* ---------- render ---------- */
  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function currentView(){
    let list = games.slice();
    if (sortOrder === "newest") list.reverse();
    if (query){
      const q = query.toLowerCase();
      list = list.filter(g =>
        g.game.toLowerCase().includes(q) ||
        g.name.toLowerCase().includes(q) ||
        g.grade.toLowerCase().includes(q));
    }
    return list;
  }

  function render(){
    const view = currentView();
    countEl.textContent = view.length + (view.length === 1 ? " game" : " games");
    shelf.innerHTML = "";

    if (!view.length){
      const noneAtAll = !games.length;
      emptyTitle.textContent = noneAtAll ? "No games yet" : "No games match your search";
      emptyText.textContent = noneAtAll
        ? "Games added to the spreadsheet appear here automatically."
        : "Try a different name, or clear the search box to see every cartridge.";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    const frag = document.createDocumentFragment();
    for (const g of view){
      const cart = document.createElement("div");
      cart.className = "cart";
      cart.tabIndex = 0;
      cart.setAttribute("role","link");
      cart.setAttribute("aria-label","Play " + (g.game || "Untitled game"));
      cart.title = "Click to play";
      cart.style.setProperty("--shell", shellFor(g.id));
      cart.innerHTML =
        '<div class="top-row"><div class="grip"></div><div class="emboss">SPARK</div></div>' +
        '<div class="sticker">' +
          '<div class="band">SPARK &bull; ' + esc(g.grade || "Boneo PS") + '</div>' +
          '<div class="sticker-body">' +
            '<div class="icon">' + iconFor(g) + '</div>' +
            '<div class="sticker-text">' +
              '<div class="gname">' + esc(g.game || "Untitled game") + '</div>' +
              '<div class="who">by ' + esc(g.name || "?") + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      // Whole cartridge is clickable -> play in the on-page player
      cart.addEventListener("click", ()=> launchGame(g));
      cart.addEventListener("keydown", (e)=>{
        if ((e.key === "Enter" || e.key === " ") && e.target === cart){
          e.preventDefault();
          launchGame(g);
        }
      });
      frag.appendChild(cart);
    }
    shelf.appendChild(frag);
  }

  /* ---------- in-page player ---------- */
  const player = document.getElementById("player");
  const playerFrame = document.getElementById("playerFrame");
  const playerClose = document.getElementById("playerClose");
  let currentGame = null;
  let lastFocused = null;

  function launchGame(g){
    currentGame = g;
    lastFocused = document.activeElement;
    player.classList.add("open");
    document.body.classList.add("playing");
    playerFrame.src = simUrl(g.id);
    playerClose.focus();
  }
  function closePlayer(){
    player.classList.remove("open");
    document.body.classList.remove("playing");
    playerFrame.src = "about:blank";   // stop the game + its audio
    currentGame = null;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  playerClose.addEventListener("click", closePlayer);
  document.addEventListener("keydown", (e)=>{
    if (e.key === "Escape" && player.classList.contains("open")) closePlayer();
  });

  /* ---------- search + sort ---------- */
  searchBox.addEventListener("input", ()=>{
    query = searchBox.value.trim();
    render();
  });
  sortBtn.addEventListener("click", ()=>{
    sortOrder = sortOrder === "newest" ? "oldest" : "newest";
    sortBtn.textContent = sortOrder === "newest" ? "Sort: Newest" : "Sort: Oldest";
    render();
  });
  document.addEventListener("keydown", (e)=>{
    if (e.key === "/" && document.activeElement !== searchBox){
      e.preventDefault();
      searchBox.focus();
    }
  });

  /* ---------- go ---------- */
  refreshGames(true);
  setInterval(()=>refreshGames(false), REFRESH_MS);
})();
</script>
</body>
</html>
